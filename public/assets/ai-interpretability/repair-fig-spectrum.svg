<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 432" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="820" height="432" fill="#FBF9F3"/>

  <text x="410" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">FROM BLUNT TO SURGICAL</text>

  <!-- Row 1 -->
  <rect x="20" y="48" width="780" height="64" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="20" y="48" width="10" height="64" fill="#9CA1A6"/>
  <text x="46" y="74" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17" letter-spacing="0.6">STANDARD FINE-TUNING</text>
  <text x="46" y="96" font-size="14" fill="#46443B">Full SFT &#183; LoRA &#183; LoRA + KL anchor</text>
  <text x="788" y="74" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#73705F">no interp signal</text>

  <!-- Row 2 -->
  <rect x="20" y="120" width="780" height="64" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="20" y="120" width="10" height="64" fill="#4F7A4A"/>
  <text x="46" y="146" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17" letter-spacing="0.6">PROBE OR DIRECTION GUIDED</text>
  <text x="46" y="168" font-size="14" fill="#46443B">Probe-guided LoRA &#183; Direction-guided LoRA (RepE / CAA)</text>
  <text x="788" y="146" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#73705F">uses a probe direction</text>

  <!-- Row 3 -->
  <rect x="20" y="192" width="780" height="64" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="20" y="192" width="10" height="64" fill="#C49A4A"/>
  <text x="46" y="218" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17" letter-spacing="0.6">SAE FEATURE GUIDED</text>
  <text x="46" y="240" font-size="14" fill="#46443B">SAE-guided LoRA &#183; SASFT (feature-penalty SFT)</text>
  <text x="788" y="218" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#73705F">uses named features</text>

  <!-- Row 4 -->
  <rect x="20" y="264" width="780" height="64" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="20" y="264" width="10" height="64" fill="#9A6A12"/>
  <text x="46" y="290" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17" letter-spacing="0.6">REPRESENTATION FINETUNING</text>
  <text x="46" y="312" font-size="14" fill="#46443B">ReFT &#183; LoReFT (15x to 65x fewer params than LoRA)</text>
  <text x="788" y="290" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#73705F">interventions on hidden states</text>

  <!-- Row 5 -->
  <rect x="20" y="336" width="780" height="64" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="20" y="336" width="10" height="64" fill="#3A4A50"/>
  <text x="46" y="362" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17" letter-spacing="0.6">CIRCUIT AND DIRECT EDIT</text>
  <text x="46" y="384" font-size="14" fill="#46443B">C-&#916;&#920; (circuit-restricted) &#183; ROME &#183; MEMIT</text>
  <text x="788" y="362" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#73705F">circuit or single fact</text>
</svg>
