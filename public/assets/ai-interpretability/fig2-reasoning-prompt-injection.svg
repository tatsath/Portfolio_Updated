<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="620" height="348" fill="#FBF9F3"/>

  <!-- gridlines + y labels -->
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#73705F">
    <line x1="92" y1="40" x2="588" y2="40" stroke="#EFE9DA" stroke-width="1"/>
    <line x1="92" y1="98" x2="588" y2="98" stroke="#EFE9DA" stroke-width="1"/>
    <line x1="92" y1="156" x2="588" y2="156" stroke="#EFE9DA" stroke-width="1"/>
    <line x1="92" y1="214" x2="588" y2="214" stroke="#EFE9DA" stroke-width="1"/>
    <line x1="92" y1="272" x2="588" y2="272" stroke="#D6CBB1" stroke-width="1.4"/>
    <text x="84" y="44" text-anchor="end">25%</text>
    <text x="84" y="102" text-anchor="end">19%</text>
    <text x="84" y="160" text-anchor="end">13%</text>
    <text x="84" y="218" text-anchor="end">6%</text>
    <text x="84" y="276" text-anchor="end">0</text>
  </g>

  <!-- bar 1: 14.8% -->
  <rect x="170" y="135" width="120" height="137" rx="3" fill="#3A4A50"/>
  <text x="230" y="122" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="18" font-weight="bold" fill="#3A4A50">14.8%</text>
  <text x="230" y="296" text-anchor="middle" font-size="14.5" fill="#1C1B17">reasoning <tspan font-weight="bold">off</tspan></text>

  <!-- bar 2: 21.7% -->
  <rect x="390" y="71" width="120" height="201" rx="3" fill="#9A6A12"/>
  <text x="450" y="58" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="18" font-weight="bold" fill="#9A6A12">21.7%</text>
  <text x="450" y="296" text-anchor="middle" font-size="14.5" fill="#1C1B17">reasoning <tspan font-weight="bold">on</tspan></text>

  <!-- delta -->
  <path d="M300 100 C 345 100, 345 100, 378 100" stroke="#9A6A12" stroke-width="1.3" fill="none" stroke-dasharray="4 3"/>
  <text x="340" y="332" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12">+6.9 points worse</text>
</svg>
