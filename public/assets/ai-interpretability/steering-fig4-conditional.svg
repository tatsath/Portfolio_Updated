<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="840" height="320" fill="#FBF9F3"/>
  <defs>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/>
    </marker>
    <marker id="ar4a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9A6A12"/>
    </marker>
  </defs>

  <g font-family="'Courier New','DejaVu Sans Mono',monospace">
    <!-- INPUT -->
    <rect x="20" y="132" width="104" height="56" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.4"/>
    <text x="72" y="166" text-anchor="middle" fill="#1C1B17" font-size="12.5" font-weight="bold">INPUT</text>

    <!-- MODEL INTERNALS -->
    <rect x="164" y="125" width="158" height="70" rx="6" fill="#F4F0E6" stroke="#9A6A12" stroke-width="1.6"/>
    <text x="243" y="153" text-anchor="middle" fill="#1C1B17" font-size="12.5" font-weight="bold">MODEL INTERNALS</text>
    <text x="243" y="173" text-anchor="middle" fill="#73705F" font-size="11" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic">activations · features</text>

    <!-- CONDITION pill -->
    <rect x="196" y="34" width="266" height="42" rx="21" fill="#ffffff" stroke="#3A4A50" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="329" y="60" text-anchor="middle" fill="#3A4A50" font-size="12" font-weight="bold">CONDITION DETECTOR · fires only when needed</text>

    <!-- STEER box -->
    <rect x="556" y="40" width="170" height="64" rx="6" fill="#9A6A12"/>
    <text x="641" y="68" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">STEER</text>
    <text x="641" y="88" text-anchor="middle" fill="#ffffff" font-size="12">add &#945; &#215; vector</text>

    <!-- OUTPUT -->
    <rect x="730" y="132" width="92" height="56" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.4"/>
    <text x="776" y="166" text-anchor="middle" fill="#1C1B17" font-size="12.5" font-weight="bold">OUTPUT</text>
  </g>

  <!-- gate diamond -->
  <polygon points="430,122 470,160 430,198 390,160" fill="#ffffff" stroke="#1C1B17" stroke-width="1.6"/>
  <text x="430" y="165" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17">steer?</text>

  <!-- arrows -->
  <g stroke="#73705F" stroke-width="1.6" fill="none">
    <line x1="124" y1="160" x2="162" y2="160" marker-end="url(#ar4)"/>
    <line x1="322" y1="160" x2="388" y2="160" marker-end="url(#ar4)"/>
  </g>
  <!-- condition dashed feed into gate -->
  <path d="M329 76 L329 100 L420 128" stroke="#3A4A50" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ar4)"/>

  <!-- YES path to STEER -->
  <path d="M470 160 L520 160 L520 72 L554 72" stroke="#9A6A12" stroke-width="1.8" fill="none" marker-end="url(#ar4a)"/>
  <text x="505" y="150" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#9A6A12">yes</text>
  <!-- STEER to OUTPUT -->
  <path d="M726 72 L776 72 L776 130" stroke="#9A6A12" stroke-width="1.8" fill="none" marker-end="url(#ar4a)"/>

  <!-- NO path bypass under -->
  <path d="M430 198 L430 250 L776 250 L776 190" stroke="#73705F" stroke-width="1.6" fill="none" marker-end="url(#ar4)"/>
  <text x="600" y="268" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" fill="#73705F">no · pass straight through</text>

  <!-- bottom note -->
  <text x="420" y="300" text-anchor="middle" font-size="13.5" fill="#1C1B17">The model&#8217;s activations decide whether to steer, before the action fires.</text>
</svg>
