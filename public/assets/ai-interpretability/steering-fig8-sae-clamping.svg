<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="880" height="320" fill="#FBF9F3"/>
  <defs>
    <marker id="fa" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/>
    </marker>
  </defs>

  <g font-family="'Courier New','DejaVu Sans Mono',monospace">
    <!-- dense activation -->
    <rect x="20" y="128" width="104" height="64" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.4"/>
    <text x="72" y="156" text-anchor="middle" fill="#1C1B17" font-size="12" font-weight="bold">DENSE</text>
    <text x="72" y="174" text-anchor="middle" fill="#1C1B17" font-size="12" font-weight="bold">ACTIVATION</text>

    <!-- encoder -->
    <rect x="156" y="128" width="96" height="64" rx="6" fill="#F4F0E6" stroke="#9A6A12" stroke-width="1.5"/>
    <text x="204" y="156" text-anchor="middle" fill="#1C1B17" font-size="12" font-weight="bold">SAE</text>
    <text x="204" y="174" text-anchor="middle" fill="#1C1B17" font-size="12" font-weight="bold">ENCODER</text>

    <!-- decoder -->
    <rect x="626" y="128" width="100" height="64" rx="6" fill="#F4F0E6" stroke="#9A6A12" stroke-width="1.5"/>
    <text x="676" y="150" text-anchor="middle" fill="#1C1B17" font-size="12" font-weight="bold">DECODER</text>
    <text x="676" y="170" text-anchor="middle" fill="#73705F" font-size="10.5" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic">re-inject</text>

    <!-- output -->
    <rect x="758" y="128" width="104" height="64" rx="6" fill="#9A6A12"/>
    <text x="810" y="156" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">STEERED</text>
    <text x="810" y="174" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">OUTPUT</text>
  </g>

  <!-- feature panel -->
  <rect x="284" y="40" width="310" height="240" rx="8" fill="#ffffff" stroke="#E4DCC9" stroke-width="1.3"/>
  <text x="300" y="66" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#73705F">SPARSE NAMED FEATURES</text>

  <!-- feature rows: label + bar -->
  <g font-family="Georgia, 'DejaVu Serif', serif" font-size="13" fill="#1C1B17">
    <!-- Golden Gate (clamped tall) -->
    <text x="300" y="100">Golden Gate Bridge</text>
    <rect x="300" y="108" width="250" height="16" rx="3" fill="#9A6A12"/>
    <text x="560" y="121" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" font-weight="bold" fill="#9A6A12">clamp</text>

    <text x="300" y="150">code quality</text>
    <rect x="300" y="158" width="70" height="16" rx="3" fill="#C9BFA6"/>

    <text x="300" y="192">social bias</text>
    <rect x="300" y="200" width="54" height="16" rx="3" fill="#C9BFA6"/>

    <text x="300" y="234">deception</text>
    <rect x="300" y="242" width="84" height="16" rx="3" fill="#C9BFA6"/>
  </g>

  <!-- clamp up-arrow on golden gate bar -->
  <path d="M540 150 L540 128" stroke="#9A6A12" stroke-width="2" fill="none" marker-end="url(#fa)"/>

  <!-- arrows between stages -->
  <g stroke="#73705F" stroke-width="1.6" fill="none">
    <line x1="124" y1="160" x2="154" y2="160" marker-end="url(#fa)"/>
    <line x1="252" y1="160" x2="282" y2="160" marker-end="url(#fa)"/>
    <line x1="594" y1="160" x2="624" y2="160" marker-end="url(#fa)"/>
    <line x1="726" y1="160" x2="756" y2="160" marker-end="url(#fa)"/>
  </g>

  <!-- bottom note -->
  <text x="440" y="306" text-anchor="middle" font-size="14" fill="#1C1B17">Decompose into named features, clamp the one you want, decode back into the stream.</text>
</svg>
