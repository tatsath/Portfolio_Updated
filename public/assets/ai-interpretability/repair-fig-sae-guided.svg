<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="760" height="380" fill="#FBF9F3"/>
  <defs>
    <marker id="sg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/></marker>
    <marker id="sgr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B5462E"/></marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">SAE-GUIDED LoRA &#183; SASFT</text>

  <!-- residual stream -->
  <rect x="40" y="74" width="120" height="220" rx="4" fill="#e6eef4" stroke="#b3c3cd" stroke-width="1.2"/>
  <text x="100" y="98" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#1C1B17">residual</text>
  <text x="100" y="114" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#1C1B17">stream</text>
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" fill="#3A4A50">
    <text x="60" y="156">+</text><text x="86" y="152">o</text><text x="120" y="160">~</text>
    <text x="78" y="184">~</text><text x="108" y="190">-</text><text x="140" y="180">o</text>
    <text x="62" y="216">o</text><text x="96" y="220">^</text><text x="130" y="224">~</text>
    <text x="80" y="252">+</text><text x="116" y="256">~</text>
  </g>

  <!-- arrow into SAE -->
  <line x1="160" y1="184" x2="216" y2="184" stroke="#73705F" stroke-width="1.6" marker-end="url(#sg)"/>

  <!-- SAE box with feature dictionary -->
  <rect x="220" y="74" width="240" height="220" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.3"/>
  <text x="340" y="98" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#1C1B17">SAE FEATURES</text>

  <!-- feature rows (bars) -->
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12">
    <!-- f1 -->
    <text x="234" y="128" fill="#46443B">English topic</text>
    <rect x="334" y="118" width="40" height="12" rx="2" fill="#C49A4A"/>
    <!-- f2 -->
    <text x="234" y="156" fill="#46443B">finance vocab</text>
    <rect x="334" y="146" width="60" height="12" rx="2" fill="#C49A4A"/>
    <!-- f3 highlighted bad -->
    <text x="234" y="184" fill="#B5462E" font-weight="bold">Chinese</text>
    <rect x="334" y="172" width="118" height="14" rx="2" fill="#B5462E"/>
    <!-- f4 -->
    <text x="234" y="212" fill="#46443B">sentiment</text>
    <rect x="334" y="202" width="48" height="12" rx="2" fill="#C49A4A"/>
    <!-- f5 -->
    <text x="234" y="240" fill="#46443B">named entity</text>
    <rect x="334" y="230" width="34" height="12" rx="2" fill="#C49A4A"/>
    <!-- f6 -->
    <text x="234" y="268" fill="#46443B">reasoning step</text>
    <rect x="334" y="258" width="28" height="12" rx="2" fill="#C49A4A"/>
  </g>
  <text x="340" y="288" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10" fill="#73705F" font-style="italic">one feature fires too strongly on the failure</text>

  <!-- penalty arrow + label -->
  <line x1="462" y1="180" x2="540" y2="180" stroke="#B5462E" stroke-width="2.2" marker-end="url(#sgr)"/>
  <text x="500" y="170" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" font-weight="bold" fill="#B5462E">penalty</text>

  <!-- loss box -->
  <rect x="544" y="138" width="180" height="92" rx="8" fill="#F4F0E6" stroke="#9A6A12" stroke-width="1.5"/>
  <text x="634" y="162" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#1C1B17">TRAINING LOSS</text>
  <text x="634" y="188" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" fill="#46443B">task loss</text>
  <text x="634" y="208" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" fill="#1C1B17">+ &#955; &#183; (bad feature)&#178;</text>

  <!-- caption -->
  <text x="380" y="334" text-anchor="middle" font-size="14" fill="#1C1B17">SASFT identifies the specific SAE feature behind the failure</text>
  <text x="380" y="354" text-anchor="middle" font-size="14" fill="#1C1B17">and adds a training penalty that holds that one feature down.</text>
</svg>
