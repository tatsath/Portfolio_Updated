<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="820" height="360" fill="#FBF9F3"/>
  <defs>
    <marker id="ml" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A6A12"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">TOOL-INTENT LIVES IN THE MIDDLE LAYERS</text>

  <!-- three layer bands -->
  <!-- early -->
  <rect x="120" y="58" width="430" height="58" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <text x="140" y="82" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#73705F">EARLY LAYERS</text>
  <text x="140" y="102" font-size="12.5" fill="#46443B">lexical and shallow syntax</text>
  <text x="534" y="92" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#9CA1A6">L 0 - 8</text>

  <!-- mid (highlighted) -->
  <rect x="120" y="124" width="430" height="78" rx="6" fill="#ffffff" stroke="#9A6A12" stroke-width="2.2"/>
  <rect x="120" y="124" width="10" height="78" fill="#9A6A12"/>
  <text x="140" y="148" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#9A6A12">MID LAYERS &#183; THE DECISION POINTS</text>
  <text x="140" y="170" font-size="12.5" fill="#1C1B17">"call the tool now" &#183; "we are in JSON mode" &#183; tool schemas</text>
  <text x="140" y="190" font-size="12.5" fill="#46443B">tool-intent SAE features concentrate here</text>
  <text x="534" y="158" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#9A6A12" font-weight="bold">L 16 - 20</text>

  <!-- late -->
  <rect x="120" y="210" width="430" height="58" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <text x="140" y="234" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#73705F">LATE LAYERS</text>
  <text x="140" y="254" font-size="12.5" fill="#46443B">surface realization: turning the decision into tokens</text>
  <text x="534" y="244" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#9CA1A6">L 28 - 32</text>

  <!-- probe reading mid -->
  <line x1="640" y1="163" x2="556" y2="163" stroke="#9A6A12" stroke-width="2" marker-end="url(#ml)"/>
  <rect x="642" y="138" width="150" height="50" rx="8" fill="#ffffff" stroke="#9A6A12" stroke-width="1.6"/>
  <text x="717" y="160" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" font-weight="bold" fill="#9A6A12">PROBE / SAE</text>
  <text x="717" y="178" text-anchor="middle" font-size="10.5" fill="#46443B" font-style="italic">reads here</text>

  <!-- caption -->
  <text x="410" y="300" text-anchor="middle" font-size="14" fill="#1C1B17">A tool call is a semantic control decision, so the signal is strongest in the middle of the stack,</text>
  <text x="410" y="320" text-anchor="middle" font-size="14" fill="#1C1B17">where tool-fine-tuned models grow new features that recognize calls, schemas, and structured output.</text>
</svg>
