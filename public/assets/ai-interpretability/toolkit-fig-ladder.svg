<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 432" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="820" height="432" fill="#FBF9F3"/>

  <!-- L1 -->
  <rect x="20" y="14" width="780" height="76" rx="8" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="32" y="30" width="44" height="44" rx="8" fill="#4F7A4A"/>
  <text x="54" y="58" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="14" font-weight="bold" fill="#ffffff">L1</text>
  <text x="96" y="46" font-size="16" font-weight="bold" fill="#1C1B17">Logit lens</text>
  <text x="96" y="70" font-size="14" fill="#46443B" font-style="italic">Where does the model commit to an answer?</text>
  <text x="788" y="46" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#73705F">cost: minutes</text>

  <!-- L2 -->
  <rect x="20" y="98" width="780" height="76" rx="8" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="32" y="114" width="44" height="44" rx="8" fill="#7FA15A"/>
  <text x="54" y="142" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="14" font-weight="bold" fill="#ffffff">L2</text>
  <text x="96" y="130" font-size="16" font-weight="bold" fill="#1C1B17">Probes</text>
  <text x="96" y="154" font-size="14" fill="#46443B" font-style="italic">Is a specific concept present in the activations?</text>
  <text x="788" y="130" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#73705F">cost: hours to days</text>

  <!-- L3 -->
  <rect x="20" y="182" width="780" height="76" rx="8" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="32" y="198" width="44" height="44" rx="8" fill="#C49A4A"/>
  <text x="54" y="226" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="14" font-weight="bold" fill="#ffffff">L3</text>
  <text x="96" y="214" font-size="16" font-weight="bold" fill="#1C1B17">Activation patching</text>
  <text x="96" y="238" font-size="14" fill="#46443B" font-style="italic">Which component is causally responsible?</text>
  <text x="788" y="214" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#73705F">cost: days</text>

  <!-- L4 -->
  <rect x="20" y="266" width="780" height="76" rx="8" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="32" y="282" width="44" height="44" rx="8" fill="#9A6A12"/>
  <text x="54" y="310" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="14" font-weight="bold" fill="#ffffff">L4</text>
  <text x="96" y="298" font-size="16" font-weight="bold" fill="#1C1B17">SAEs and feature steering</text>
  <text x="96" y="322" font-size="14" fill="#46443B" font-style="italic">What named concepts are active, and can I move them?</text>
  <text x="788" y="298" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#73705F">cost: days to weeks</text>

  <!-- L5 -->
  <rect x="20" y="350" width="780" height="76" rx="8" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="32" y="366" width="44" height="44" rx="8" fill="#3A4A50"/>
  <text x="54" y="394" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="14" font-weight="bold" fill="#ffffff">L5</text>
  <text x="96" y="382" font-size="16" font-weight="bold" fill="#1C1B17">Circuits</text>
  <text x="96" y="406" font-size="14" fill="#46443B" font-style="italic">How does the model reason, end to end?</text>
  <text x="788" y="382" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#73705F">cost: weeks to months</text>
</svg>
