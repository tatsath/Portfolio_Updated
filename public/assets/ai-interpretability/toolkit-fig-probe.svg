<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="660" height="360" fill="#FBF9F3"/>
  <defs>
    <marker id="lp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/></marker>
    <marker id="lpu" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4F7A4A"/></marker>
    <marker id="lpd" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B5462E"/></marker>
  </defs>

  <text x="330" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">LINEAR PROBE</text>

  <!-- sentence -->
  <rect x="40" y="48" width="580" height="44" rx="8" fill="#F4F0E6" stroke="#D6CBB1" stroke-width="1.2"/>
  <text x="330" y="76" text-anchor="middle" font-size="14" fill="#1C1B17">&#8220;Apple beats earnings expectations. Prices will go up.&#8221;</text>

  <!-- layer chain -->
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold">
    <rect x="60" y="120" width="130" height="36" rx="6" fill="#ffffff" stroke="#3A4A50" stroke-width="1.2"/>
    <text x="125" y="143" text-anchor="middle" fill="#1C1B17">Layer 1</text>
    <rect x="60" y="166" width="130" height="36" rx="6" fill="#ffffff" stroke="#3A4A50" stroke-width="1.2"/>
    <text x="125" y="189" text-anchor="middle" fill="#1C1B17">Layer 2</text>
    <rect x="60" y="212" width="130" height="36" rx="6" fill="#ffffff" stroke="#3A4A50" stroke-width="1.2"/>
    <text x="125" y="235" text-anchor="middle" fill="#1C1B17">Layer 3</text>
    <rect x="60" y="258" width="130" height="36" rx="6" fill="#3A4A50"/>
    <text x="125" y="281" text-anchor="middle" fill="#ffffff">LLM</text>
  </g>
  <g stroke="#73705F" stroke-width="1.3" fill="none">
    <line x1="125" y1="92" x2="125" y2="120" marker-end="url(#lp)"/>
    <line x1="125" y1="156" x2="125" y2="166" marker-end="url(#lp)"/>
    <line x1="125" y1="202" x2="125" y2="212" marker-end="url(#lp)"/>
    <line x1="125" y1="248" x2="125" y2="258" marker-end="url(#lp)"/>
  </g>

  <!-- probe -->
  <text x="455" y="150" text-anchor="middle" font-size="13" fill="#46443B">Price will go up?</text>
  <rect x="370" y="168" width="170" height="46" rx="8" fill="#4F7A4A"/>
  <text x="455" y="197" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#ffffff">Linear probe</text>
  <line x1="190" y1="230" x2="368" y2="200" stroke="#73705F" stroke-width="1.6" fill="none" marker-end="url(#lp)"/>

  <!-- yes / no -->
  <ellipse cx="400" cy="288" rx="44" ry="24" fill="#ffffff" stroke="#4F7A4A" stroke-width="1.6"/>
  <text x="400" y="293" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#4F7A4A">Yes</text>
  <ellipse cx="510" cy="288" rx="44" ry="24" fill="#ffffff" stroke="#B5462E" stroke-width="1.6"/>
  <text x="510" y="293" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#B5462E">No</text>
  <line x1="430" y1="216" x2="408" y2="262" stroke="#4F7A4A" stroke-width="1.6" marker-end="url(#lpu)"/>
  <line x1="490" y1="216" x2="505" y2="262" stroke="#B5462E" stroke-width="1.6" marker-end="url(#lpd)"/>
</svg>
