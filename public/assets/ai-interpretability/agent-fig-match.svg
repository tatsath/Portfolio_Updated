<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 352" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="820" height="352" fill="#FBF9F3"/>

  <rect x="20" y="16" width="500" height="48" rx="6" fill="#1C1B17"/>
  <text x="40" y="46" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#ffffff">IF THE AGENT RISK IS...</text>
  <rect x="528" y="16" width="272" height="48" rx="6" fill="#9A6A12"/>
  <text x="548" y="46" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#ffffff">GATE ON...</text>

  <g font-size="14">
    <rect x="20" y="72" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="102" fill="#1C1B17">a hijacked call from injected content</text>
    <rect x="528" y="72" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="102" fill="#9A6A12" font-weight="bold">context-stage probe</text>

    <rect x="20" y="128" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="158" fill="#1C1B17">a wrong or hallucinated tool selection</text>
    <rect x="528" y="128" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="158" fill="#9A6A12" font-weight="bold">tool-selection probe</text>

    <rect x="20" y="184" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="214" fill="#1C1B17">a high-stakes or irreversible action</text>
    <rect x="528" y="184" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="214" fill="#9A6A12" font-weight="bold">high-stakes probe + review</text>

    <rect x="20" y="240" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="270" fill="#1C1B17">drift over a long trajectory</text>
    <rect x="528" y="240" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="270" fill="#9A6A12" font-weight="bold">trajectory-level monitor</text>

    <rect x="20" y="296" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="326" fill="#1C1B17">a recurring failure you must fix for good</text>
    <rect x="528" y="296" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="326" fill="#9A6A12" font-weight="bold">repair the model (essay 4)</text>
  </g>
