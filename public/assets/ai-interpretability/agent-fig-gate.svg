<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="860" height="320" fill="#FBF9F3"/>
  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/></marker>
    <marker id="g1g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4F7A4A"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">THE PRE-ACTION GATE</text>

  <!-- Model -->
  <rect x="28" y="92" width="150" height="72" rx="8" fill="#3A4A50"/>
  <text x="103" y="122" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#ffffff">MODEL</text>
  <text x="103" y="142" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic" font-size="11" fill="#ffffff">forms the tool call</text>

  <line x1="178" y1="128" x2="210" y2="128" stroke="#73705F" stroke-width="1.6" marker-end="url(#g1)"/>

  <!-- Probe -->
  <rect x="212" y="86" width="190" height="84" rx="8" fill="#ffffff" stroke="#4F7A4A" stroke-width="1.6"/>
  <text x="307" y="112" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#4F7A4A">PROBE</text>
  <text x="307" y="132" text-anchor="middle" font-size="11.5" fill="#46443B">reads the residual stream</text>
  <text x="307" y="150" text-anchor="middle" font-size="11.5" fill="#46443B">in the same forward pass</text>

  <line x1="402" y1="128" x2="434" y2="128" stroke="#73705F" stroke-width="1.6" marker-end="url(#g1)"/>

  <!-- Gate -->
  <rect x="436" y="80" width="190" height="96" rx="8" fill="#1C1B17"/>
  <text x="531" y="106" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#ffffff">DECISION GATE</text>
  <text x="531" y="128" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#4F7A4A" font-weight="bold">ALLOW</text>
  <text x="531" y="146" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#C49A4A" font-weight="bold">REVIEW / REROUTE</text>
  <text x="531" y="164" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#B5462E" font-weight="bold">BLOCK</text>

  <line x1="626" y1="128" x2="658" y2="128" stroke="#4F7A4A" stroke-width="1.8" marker-end="url(#g1g)"/>

  <!-- Tool executes -->
  <rect x="660" y="92" width="170" height="72" rx="8" fill="#F4F0E6" stroke="#D6CBB1" stroke-width="1.3"/>
  <text x="745" y="122" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#1C1B17">TOOL EXECUTES</text>
  <text x="745" y="142" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic" font-size="11" fill="#46443B">only if allowed</text>

  <!-- captions -->
  <text x="430" y="226" text-anchor="middle" font-size="14" fill="#1C1B17">The probe runs in the same forward pass that produces the call.</text>
  <text x="430" y="250" text-anchor="middle" font-size="14" fill="#1C1B17">Detection is nearly free, and it happens before the action fires.</text>
  <text x="430" y="286" text-anchor="middle" font-style="italic" font-size="13" fill="#73705F">This is the one moment when intervention is still cheap and fully reversible.</text>
</svg>
