<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 304" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="470" height="304" fill="#FBF9F3"/>
  <defs>
    <marker id="ll" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/></marker>
  </defs>

  <text x="235" y="26" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">LOGIT LENS</text>

  <!-- input tokens -->
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12">
    <rect x="16" y="72" width="48" height="30" rx="5" fill="#F4F0E6" stroke="#D6CBB1" stroke-width="1.1"/>
    <text x="40" y="92" text-anchor="middle" fill="#1C1B17">The</text>
    <rect x="16" y="124" width="48" height="30" rx="5" fill="#F4F0E6" stroke="#D6CBB1" stroke-width="1.1"/>
    <text x="40" y="144" text-anchor="middle" fill="#1C1B17">cat</text>
    <rect x="16" y="176" width="48" height="30" rx="5" fill="#F4F0E6" stroke="#D6CBB1" stroke-width="1.1"/>
    <text x="40" y="196" text-anchor="middle" fill="#1C1B17">sat</text>
  </g>
  <g stroke="#73705F" stroke-width="1.3" fill="none">
    <path d="M64 87 L150 100"/>
    <path d="M64 139 L150 112" marker-end="url(#ll)"/>
    <path d="M64 191 L150 124"/>
  </g>

  <!-- layer chain -->
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold">
    <rect x="150" y="84" width="150" height="38" rx="6" fill="#ffffff" stroke="#3A4A50" stroke-width="1.3"/>
    <text x="225" y="108" text-anchor="middle" fill="#1C1B17">Layer 1</text>
    <rect x="150" y="136" width="150" height="38" rx="6" fill="#ffffff" stroke="#3A4A50" stroke-width="1.3"/>
    <text x="225" y="160" text-anchor="middle" fill="#1C1B17">Layer 2</text>
    <rect x="150" y="188" width="150" height="38" rx="6" fill="#ffffff" stroke="#3A4A50" stroke-width="1.3"/>
    <text x="225" y="212" text-anchor="middle" fill="#1C1B17">Layer 3</text>
    <rect x="150" y="240" width="150" height="38" rx="6" fill="#ffffff" stroke="#3A4A50" stroke-width="1.3"/>
    <text x="225" y="264" text-anchor="middle" fill="#1C1B17">Layer 4</text>
  </g>
  <g stroke="#73705F" stroke-width="1.4" fill="none">
    <line x1="225" y1="122" x2="225" y2="136" marker-end="url(#ll)"/>
    <line x1="225" y1="174" x2="225" y2="188" marker-end="url(#ll)"/>
    <line x1="225" y1="226" x2="225" y2="240" marker-end="url(#ll)"/>
  </g>

  <!-- decoded tokens -->
  <text x="390" y="74" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#73705F">decoded token</text>
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5">
    <rect x="340" y="84" width="100" height="38" rx="6" fill="#F4F0E6" stroke="#C49A4A" stroke-width="1.2"/>
    <text x="390" y="108" text-anchor="middle" fill="#9A6A12" font-weight="bold">The</text>
    <rect x="340" y="136" width="100" height="38" rx="6" fill="#F4F0E6" stroke="#C49A4A" stroke-width="1.2"/>
    <text x="390" y="160" text-anchor="middle" fill="#9A6A12" font-weight="bold">cat</text>
    <rect x="340" y="188" width="100" height="38" rx="6" fill="#F4F0E6" stroke="#C49A4A" stroke-width="1.2"/>
    <text x="390" y="212" text-anchor="middle" fill="#9A6A12" font-weight="bold">sat</text>
    <rect x="340" y="240" width="100" height="38" rx="6" fill="#F4F0E6" stroke="#C49A4A" stroke-width="1.2"/>
    <text x="390" y="264" text-anchor="middle" fill="#9A6A12" font-weight="bold">table</text>
  </g>
  <g stroke="#73705F" stroke-width="1.3" fill="none">
    <line x1="300" y1="103" x2="340" y2="103" marker-end="url(#ll)"/>
    <line x1="300" y1="155" x2="340" y2="155" marker-end="url(#ll)"/>
    <line x1="300" y1="207" x2="340" y2="207" marker-end="url(#ll)"/>
    <line x1="300" y1="259" x2="340" y2="259" marker-end="url(#ll)"/>
