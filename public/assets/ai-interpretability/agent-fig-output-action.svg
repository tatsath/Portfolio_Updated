<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="820" height="400" fill="#FBF9F3"/>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/></marker>
    <marker id="a1r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B5462E"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">WHEN THE OUTPUT IS THE ACTION</text>

  <line x1="410" y1="56" x2="410" y2="372" stroke="#E4DCC9" stroke-width="1.2"/>

  <!-- LEFT: chatbot -->
  <text x="210" y="76" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#73705F">CHATBOT</text>

  <rect x="110" y="90" width="200" height="44" rx="6" fill="#3A4A50"/>
  <text x="210" y="118" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#ffffff">MODEL</text>
  <line x1="210" y1="134" x2="210" y2="158" stroke="#73705F" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="110" y="160" width="200" height="44" rx="6" fill="#F4F0E6" stroke="#D6CBB1" stroke-width="1.2"/>
  <text x="210" y="188" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" fill="#46443B">text output</text>
  <line x1="210" y1="204" x2="210" y2="228" stroke="#73705F" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="110" y="230" width="200" height="44" rx="6" fill="#ffffff" stroke="#4F7A4A" stroke-width="1.6"/>
  <text x="210" y="258" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#4F7A4A">OUTPUT FILTER</text>
  <line x1="210" y1="274" x2="210" y2="298" stroke="#73705F" stroke-width="1.6" marker-end="url(#a1)"/>

  <text x="210" y="316" text-anchor="middle" font-size="13" fill="#1C1B17">delivered to the user</text>
  <text x="210" y="352" text-anchor="middle" font-style="italic" font-size="13" fill="#46443B">there is an "after." you can check it.</text>

  <!-- RIGHT: agent -->
  <text x="610" y="76" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#73705F">AGENT</text>

  <rect x="510" y="90" width="200" height="44" rx="6" fill="#3A4A50"/>
  <text x="610" y="118" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#ffffff">MODEL</text>
  <line x1="610" y1="134" x2="610" y2="158" stroke="#73705F" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="510" y="160" width="200" height="44" rx="6" fill="#F4F0E6" stroke="#D6CBB1" stroke-width="1.2"/>
  <text x="610" y="188" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" fill="#46443B">tool call: transfer_funds()</text>
  <line x1="610" y1="204" x2="610" y2="228" stroke="#B5462E" stroke-width="1.8" marker-end="url(#a1r)"/>

  <rect x="510" y="230" width="200" height="44" rx="6" fill="#B5462E"/>
  <text x="610" y="258" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#ffffff">EXECUTES</text>

  <text x="610" y="316" text-anchor="middle" font-size="13" fill="#1C1B17">the money has moved</text>
  <text x="610" y="352" text-anchor="middle" font-style="italic" font-size="13" fill="#B5462E">no "after." the call is the output.</text>
</svg>
