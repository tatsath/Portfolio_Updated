<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="720" height="320" fill="#FBF9F3"/>
  <defs>
    <marker id="sd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9A6A12"/>
    </marker>
  </defs>

  <!-- plot frame -->
  <rect x="70" y="40" width="430" height="232" rx="6" fill="#ffffff" stroke="#E4DCC9" stroke-width="1.2"/>

  <!-- decision boundary (the probe) -->
  <line x1="120" y1="252" x2="470" y2="64" stroke="#3A4A50" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="438" y="58" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#3A4A50">linear probe</text>

  <!-- cluster: deceptive (upper-left), slate -->
  <circle cx="170" cy="110" r="7" fill="#3A4A50"/>
  <circle cx="210" cy="95" r="7" fill="#3A4A50"/>
  <circle cx="160" cy="150" r="7" fill="#3A4A50"/>
  <circle cx="245" cy="120" r="7" fill="#3A4A50"/>
  <circle cx="205" cy="150" r="7" fill="#3A4A50"/>
  <text x="150" y="84" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#3A4A50">deceptive</text>

  <!-- cluster: truthful (lower-right), ochre -->
  <circle cx="360" cy="210" r="7" fill="#9A6A12"/>
  <circle cx="405" cy="225" r="7" fill="#9A6A12"/>
  <circle cx="345" cy="240" r="7" fill="#9A6A12"/>
  <circle cx="420" cy="195" r="7" fill="#9A6A12"/>
  <circle cx="385" cy="245" r="7" fill="#9A6A12"/>
  <text x="360" y="262" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#9A6A12">truthful</text>

  <!-- steering direction arrow: push a point across the boundary -->
  <circle cx="250" cy="160" r="7" fill="none" stroke="#9A6A12" stroke-width="2"/>
  <line x1="258" y1="166" x2="330" y2="210" stroke="#9A6A12" stroke-width="2.4" marker-end="url(#sd)"/>
  <text x="300" y="150" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#9A6A12">steer along</text>
  <text x="300" y="166" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#9A6A12">the normal</text>

  <!-- right note -->
  <text x="520" y="120" font-size="14" fill="#1C1B17">The probe's normal</text>
  <text x="520" y="142" font-size="14" fill="#1C1B17">is the steering</text>
  <text x="520" y="164" font-size="14" fill="#1C1B17">direction.</text>
  <text x="520" y="200" font-size="13" fill="#73705F" font-style="italic">ITI applies it only</text>
  <text x="520" y="218" font-size="13" fill="#73705F" font-style="italic">in the heads that</text>
  <text x="520" y="236" font-size="13" fill="#73705F" font-style="italic">carry the signal.</text>
</svg>
