<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="760" height="380" fill="#FBF9F3"/>
  <defs>
    <marker id="pgl" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A6A12"/></marker>
    <marker id="pgl2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/></marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">PROBE-GUIDED LoRA</text>

  <!-- BEFORE plot -->
  <text x="200" y="60" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#73705F">BEFORE TRAINING</text>
  <rect x="60" y="74" width="280" height="240" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>

  <!-- probe direction arrow -->
  <line x1="84" y1="294" x2="318" y2="94" stroke="#9A6A12" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#pgl)"/>
  <text x="280" y="298" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#9A6A12" font-style="italic">probe direction</text>

  <!-- good cluster (lower-left) BEFORE -->
  <g fill="#4F7A4A">
    <circle cx="106" cy="248" r="4.5"/><circle cx="118" cy="262" r="4.5"/><circle cx="130" cy="250" r="4.5"/>
    <circle cx="122" cy="238" r="4.5"/><circle cx="142" cy="258" r="4.5"/><circle cx="110" cy="270" r="4.5"/>
  </g>
  <text x="110" y="226" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#4F7A4A">good</text>

  <!-- bad cluster (upper-right, far along probe) BEFORE -->
  <g fill="#B5462E">
    <circle cx="248" cy="138" r="4.5"/><circle cx="262" cy="150" r="4.5"/><circle cx="272" cy="132" r="4.5"/>
    <circle cx="258" cy="124" r="4.5"/><circle cx="280" cy="146" r="4.5"/><circle cx="244" cy="156" r="4.5"/>
  </g>
  <text x="298" y="142" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#B5462E" text-anchor="end">bad</text>

  <!-- AFTER plot -->
  <text x="560" y="60" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#73705F">AFTER TRAINING</text>
  <rect x="420" y="74" width="280" height="240" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>

  <line x1="444" y1="294" x2="678" y2="94" stroke="#9A6A12" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#pgl)"/>
  <text x="640" y="298" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#9A6A12" font-style="italic">probe direction</text>

  <!-- good cluster AFTER (same place) -->
  <g fill="#4F7A4A">
    <circle cx="466" cy="248" r="4.5"/><circle cx="478" cy="262" r="4.5"/><circle cx="490" cy="250" r="4.5"/>
    <circle cx="482" cy="238" r="4.5"/><circle cx="502" cy="258" r="4.5"/><circle cx="470" cy="270" r="4.5"/>
  </g>
  <text x="470" y="226" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#4F7A4A">good</text>

  <!-- bad cluster AFTER (pulled off the probe direction, closer to perpendicular) -->
  <g fill="#B5462E">
    <circle cx="498" cy="216" r="4.5"/><circle cx="514" cy="228" r="4.5"/><circle cx="528" cy="212" r="4.5"/>
    <circle cx="510" cy="202" r="4.5"/><circle cx="534" cy="226" r="4.5"/><circle cx="496" cy="232" r="4.5"/>
  </g>
  <text x="556" y="216" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#B5462E" text-anchor="start">bad</text>

  <!-- training arrow between plots -->
  <line x1="346" y1="194" x2="416" y2="194" stroke="#73705F" stroke-width="2" marker-end="url(#pgl2)"/>
  <text x="381" y="184" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" font-weight="bold" fill="#73705F">train</text>

  <!-- caption -->
  <text x="380" y="342" text-anchor="middle" font-size="14" fill="#1C1B17">The probe defines a "failure direction" in activation space.</text>
  <text x="380" y="362" text-anchor="middle" font-size="14" fill="#1C1B17">Training adds a penalty that pulls bad examples off it, without disturbing the rest.</text>
</svg>
