<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="800" height="380" fill="#FBF9F3"/>
  <defs>
    <marker id="cd" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A6A12"/></marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">CIRCUIT-RESTRICTED WEIGHT EDIT (C-&#916;&#920;)</text>

  <!-- model grid: 12 layers x 5 cells (4 heads + 1 MLP) -->
  <text x="160" y="64" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#73705F">MODEL PARAMETERS</text>
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="9" fill="#73705F">
    <text x="76" y="84" text-anchor="middle">h0</text><text x="100" y="84" text-anchor="middle">h1</text><text x="124" y="84" text-anchor="middle">h2</text><text x="148" y="84" text-anchor="middle">h3</text><text x="184" y="84" text-anchor="middle">MLP</text>
  </g>

  <!-- 12 rows of 5 cells; highlight a few as the circuit -->
  <g>
    <!-- helper: each cell 20x20 with 4px gap. cols x: 68,92,116,140 (heads), 168 (mlp). rows y: 92,116,...,12 rows -->
    <!-- Row L0 -->
    <rect x="68" y="92" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="92" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="116" y="92" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="140" y="92" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="168" y="92" width="40" height="20" rx="2" fill="#e6e0d2"/>
    <!-- Row L1 -->
    <rect x="68" y="116" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="116" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="116" y="116" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="140" y="116" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="168" y="116" width="40" height="20" rx="2" fill="#e6e0d2"/>
    <!-- Row L2 -->
    <rect x="68" y="140" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="140" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="116" y="140" width="20" height="20" rx="2" fill="#9A6A12"/>
    <rect x="140" y="140" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="168" y="140" width="40" height="20" rx="2" fill="#e6e0d2"/>
    <!-- Row L3 -->
    <rect x="68" y="164" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="164" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="116" y="164" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="140" y="164" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="168" y="164" width="40" height="20" rx="2" fill="#e6e0d2"/>
    <!-- Row L4 -->
    <rect x="68" y="188" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="188" width="20" height="20" rx="2" fill="#9A6A12"/>
    <rect x="116" y="188" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="140" y="188" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="168" y="188" width="40" height="20" rx="2" fill="#e6e0d2"/>
    <!-- Row L5 -->
    <rect x="68" y="212" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="212" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="116" y="212" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="140" y="212" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="168" y="212" width="40" height="20" rx="2" fill="#9A6A12"/>
    <!-- Row L6 -->
    <rect x="68" y="236" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="236" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="116" y="236" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="140" y="236" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="168" y="236" width="40" height="20" rx="2" fill="#e6e0d2"/>
    <!-- Row L7 -->
    <rect x="68" y="260" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="260" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="116" y="260" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="140" y="260" width="20" height="20" rx="2" fill="#9A6A12"/>
    <rect x="168" y="260" width="40" height="20" rx="2" fill="#e6e0d2"/>
    <!-- Row L8 -->
    <rect x="68" y="284" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="284" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="116" y="284" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="140" y="284" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="168" y="284" width="40" height="20" rx="2" fill="#e6e0d2"/>
    <!-- Row L9 -->
    <rect x="68" y="308" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="92" y="308" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="116" y="308" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="140" y="308" width="20" height="20" rx="2" fill="#e6e0d2"/>
    <rect x="168" y="308" width="40" height="20" rx="2" fill="#e6e0d2"/>
  </g>

  <!-- layer labels -->
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="9" fill="#73705F">
    <text x="48" y="106" text-anchor="end">L0</text>
    <text x="48" y="154" text-anchor="end">L2</text>
    <text x="48" y="202" text-anchor="end">L4</text>
    <text x="48" y="250" text-anchor="end">L6</text>
    <text x="48" y="298" text-anchor="end">L8</text>
  </g>

  <!-- arrow + EAP-IG label -->
  <line x1="224" y1="208" x2="296" y2="208" stroke="#9A6A12" stroke-width="2" marker-end="url(#cd)"/>
  <text x="260" y="198" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" font-weight="bold" fill="#9A6A12">EAP-IG</text>
  <text x="260" y="222" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic" font-size="10.5" fill="#73705F">find the circuit</text>

  <!-- circuit subset (right side) -->
  <text x="500" y="64" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#73705F">THE CIRCUIT (&lt; 5% OF PARAMS)</text>
  <rect x="320" y="84" width="360" height="200" rx="8" fill="#ffffff" stroke="#9A6A12" stroke-width="1.6"/>
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#1C1B17">
    <rect x="344" y="112" width="80" height="26" rx="3" fill="#9A6A12"/>
    <text x="384" y="129" text-anchor="middle" fill="#ffffff" font-weight="bold">L2 &#183; head 2</text>

    <rect x="344" y="150" width="80" height="26" rx="3" fill="#9A6A12"/>
    <text x="384" y="167" text-anchor="middle" fill="#ffffff" font-weight="bold">L4 &#183; head 1</text>

    <rect x="344" y="188" width="80" height="26" rx="3" fill="#9A6A12"/>
    <text x="384" y="205" text-anchor="middle" fill="#ffffff" font-weight="bold">L5 &#183; MLP</text>

    <rect x="344" y="226" width="80" height="26" rx="3" fill="#9A6A12"/>
    <text x="384" y="243" text-anchor="middle" fill="#ffffff" font-weight="bold">L7 &#183; head 3</text>

    <text x="450" y="129" fill="#46443B">refusal trigger</text>
    <text x="450" y="167" fill="#46443B">policy match</text>
    <text x="450" y="205" fill="#46443B">refusal route</text>
    <text x="450" y="243" fill="#46443B">output gate</text>
  </g>

  <!-- update arrow -->
  <text x="500" y="306" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#9A6A12">&#916;&#952;_C applied only here</text>

  <!-- caption -->
  <text x="400" y="346" text-anchor="middle" font-size="14" fill="#1C1B17">Localize the circuit first, then update only the parameters that belong to it.</text>
  <text x="400" y="366" text-anchor="middle" font-size="14" fill="#1C1B17">The other 95% of the model is left untouched.</text>
</svg>
