<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="800" height="372" fill="#FBF9F3"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/>
    </marker>
  </defs>

  <g font-family="'Courier New','DejaVu Sans Mono',monospace">
    <rect x="20" y="20" width="180" height="34" rx="5" fill="#9A6A12"/>
    <text x="110" y="42" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">INTERPRETABILITY</text>
    <line x1="110" y1="54" x2="110" y2="150" stroke="#9A6A12" stroke-width="1.4"/>

    <rect x="232" y="20" width="236" height="34" rx="5" fill="none" stroke="#3A4A50" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="350" y="42" text-anchor="middle" fill="#3A4A50" font-size="12.5" font-weight="bold">CoT MONITORING</text>
    <line x1="350" y1="54" x2="350" y2="150" stroke="#3A4A50" stroke-width="1.4" stroke-dasharray="5 4"/>

    <rect x="600" y="20" width="150" height="34" rx="5" fill="none" stroke="#73705F" stroke-width="1.5"/>
    <text x="675" y="42" text-anchor="middle" fill="#46443B" font-size="12.5" font-weight="bold">OUTPUT MON.</text>
    <line x1="675" y1="54" x2="675" y2="150" stroke="#73705F" stroke-width="1.4"/>
  </g>

  <g font-style="italic" fill="#73705F" font-size="12.5">
    <text x="110" y="74" text-anchor="middle">earliest signal</text>
    <text x="350" y="74" text-anchor="middle">partial · can be performance</text>
    <text x="675" y="74" text-anchor="middle">sees it last</text>
  </g>

  <g font-family="'Courier New','DejaVu Sans Mono',monospace">
    <rect x="36" y="156" width="148" height="62" rx="6" fill="#F4F0E6" stroke="#9A6A12" stroke-width="1.6"/>
    <text x="110" y="184" text-anchor="middle" fill="#1C1B17" font-size="12.5" font-weight="bold">INTERNAL</text>
    <text x="110" y="201" text-anchor="middle" fill="#1C1B17" font-size="12.5" font-weight="bold">STATE</text>

    <rect x="262" y="156" width="176" height="62" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.4"/>
    <text x="350" y="183" text-anchor="middle" fill="#1C1B17" font-size="12.5" font-weight="bold">REASONING</text>
    <text x="350" y="201" text-anchor="middle" fill="#73705F" font-size="11">(chain of thought)</text>

    <rect x="510" y="156" width="120" height="62" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.4"/>
    <text x="570" y="184" text-anchor="middle" fill="#1C1B17" font-size="12.5" font-weight="bold">ACTION /</text>
    <text x="570" y="201" text-anchor="middle" fill="#1C1B17" font-size="12.5" font-weight="bold">TOOL CALL</text>

    <rect x="652" y="156" width="98" height="62" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.4"/>
    <text x="701" y="183" text-anchor="middle" fill="#1C1B17" font-size="12.5" font-weight="bold">OUTPUT</text>
    <text x="701" y="201" text-anchor="middle" fill="#73705F" font-size="11">/ LOG</text>
  </g>

  <g stroke="#73705F" stroke-width="1.6" fill="none">
    <line x1="184" y1="187" x2="256" y2="187" marker-end="url(#ar)"/>
    <line x1="438" y1="187" x2="504" y2="187" marker-end="url(#ar)"/>
    <line x1="630" y1="187" x2="646" y2="187" marker-end="url(#ar)"/>
  </g>

  <g>
    <line x1="36" y1="276" x2="764" y2="276" stroke="#D6CBB1" stroke-width="1.4"/>
    <circle cx="110" cy="276" r="6" fill="#9A6A12"/>
    <circle cx="701" cy="276" r="6" fill="none" stroke="#73705F" stroke-width="1.6"/>
    <text x="110" y="304" text-anchor="middle" font-size="13.5" fill="#1C1B17">a failure <tspan font-style="italic">forms</tspan> here</text>
    <text x="701" y="304" text-anchor="middle" font-size="13.5" fill="#1C1B17">becomes <tspan font-style="italic">visible</tspan> here</text>
    <text x="418" y="340" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" fill="#73705F">— output monitoring is the last line, not the first —</text>
  </g>
</svg>
