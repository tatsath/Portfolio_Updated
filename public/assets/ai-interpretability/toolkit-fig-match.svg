<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="820" height="356" fill="#FBF9F3"/>

  <rect x="20" y="16" width="500" height="48" rx="6" fill="#1C1B17"/>
  <text x="40" y="46" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#ffffff">IF YOUR QUESTION IS...</text>
  <rect x="528" y="16" width="272" height="48" rx="6" fill="#9A6A12"/>
  <text x="548" y="46" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#ffffff">REACH FOR...</text>

  <g font-size="14">
    <rect x="20" y="72" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="102" fill="#1C1B17">Where did the model decide this token?</text>
    <rect x="528" y="72" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="102" fill="#9A6A12" font-weight="bold">the logit lens</text>

    <rect x="20" y="128" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="158" fill="#1C1B17">Is a specific concept present right now?</text>
    <rect x="528" y="128" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="158" fill="#9A6A12" font-weight="bold">a probe</text>

    <rect x="20" y="184" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="214" fill="#1C1B17">Which component is causing this behavior?</text>
    <rect x="528" y="184" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="214" fill="#9A6A12" font-weight="bold">activation patching</text>

    <rect x="20" y="240" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="270" fill="#1C1B17">What concepts fire, and can I nudge them?</text>
    <rect x="528" y="240" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="270" fill="#9A6A12" font-weight="bold">SAEs + steering</text>

    <rect x="20" y="296" width="500" height="50" rx="5" fill="#ffffff" stroke="#E4DCC9" stroke-width="1"/>
    <text x="40" y="326" fill="#1C1B17">How does it reason, end to end?</text>
    <rect x="528" y="296" width="272" height="50" rx="5" fill="#F4F0E6" stroke="#E4DCC9" stroke-width="1"/>
    <text x="548" y="326" fill="#9A6A12" font-weight="bold">trace the circuit</text>
  </g>
</svg>
