<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="820" height="400" fill="#FBF9F3"/>
  <defs>
    <marker id="arc" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/></marker>
    <marker id="arcr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B5462E"/></marker>
    <marker id="arcg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4F7A4A"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">FOUR PROBES ON THE RESIDUAL STREAM</text>

  <!-- residual stream visualization -->
  <rect x="60" y="84" width="160" height="232" rx="6" fill="#e6eef4" stroke="#b3c3cd" stroke-width="1.4"/>
  <text x="140" y="108" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#3A4A50">RESIDUAL</text>
  <text x="140" y="124" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#3A4A50">STREAM</text>
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" fill="#3A4A50">
    <text x="78" y="158">+</text><text x="106" y="156">o</text><text x="140" y="162">~</text><text x="172" y="158">-</text>
    <text x="84" y="186">~</text><text x="118" y="190">^</text><text x="148" y="184">o</text><text x="180" y="192">+</text>
    <text x="76" y="216">o</text><text x="112" y="214">~</text><text x="146" y="222">-</text><text x="178" y="218">^</text>
    <text x="92" y="248">^</text><text x="126" y="252">+</text><text x="158" y="246">~</text><text x="186" y="250">o</text>
    <text x="80" y="278">+</text><text x="116" y="282">~</text><text x="150" y="276">^</text><text x="184" y="280">-</text>
    <text x="98" y="306">o</text><text x="132" y="304">+</text></g>

  <!-- 4 probes -->
  <g font-family="'Courier New','DejaVu Sans Mono',monospace">
    <!-- Probe 1: Prompt Guard -->
    <rect x="300" y="92" width="200" height="48" rx="6" fill="#ffffff" stroke="#9A6A12" stroke-width="1.4"/>
    <text x="316" y="114" font-size="12" font-weight="bold" fill="#1C1B17">PROMPT GUARD</text>
    <text x="316" y="132" font-size="11" fill="#73705F">direct injection / jailbreak</text>
    <line x1="220" y1="116" x2="298" y2="116" stroke="#73705F" stroke-width="1.4" marker-end="url(#arc)"/>

    <!-- Probe 2: Context Guard -->
    <rect x="300" y="152" width="200" height="48" rx="6" fill="#ffffff" stroke="#9A6A12" stroke-width="1.4"/>
    <text x="316" y="174" font-size="12" font-weight="bold" fill="#1C1B17">CONTEXT GUARD</text>
    <text x="316" y="192" font-size="11" fill="#73705F">indirect / RAG poisoning</text>
    <line x1="220" y1="176" x2="298" y2="176" stroke="#73705F" stroke-width="1.4" marker-end="url(#arc)"/>

    <!-- Probe 3: Output Shield -->
    <rect x="300" y="212" width="200" height="48" rx="6" fill="#ffffff" stroke="#9A6A12" stroke-width="1.4"/>
    <text x="316" y="234" font-size="12" font-weight="bold" fill="#1C1B17">OUTPUT SHIELD</text>
    <text x="316" y="252" font-size="11" fill="#73705F">unsafe-output emergence</text>
    <line x1="220" y1="236" x2="298" y2="236" stroke="#73705F" stroke-width="1.4" marker-end="url(#arc)"/>

    <!-- Probe 4: Threat Radar -->
    <rect x="300" y="272" width="200" height="48" rx="6" fill="#ffffff" stroke="#9A6A12" stroke-width="1.4"/>
    <text x="316" y="294" font-size="12" font-weight="bold" fill="#1C1B17">THREAT RADAR</text>
    <text x="316" y="312" font-size="11" fill="#73705F">offensive-tactic patterns</text>
    <line x1="220" y1="296" x2="298" y2="296" stroke="#73705F" stroke-width="1.4" marker-end="url(#arc)"/>
  </g>

  <!-- 4 score arrows into decision gate -->
  <g stroke="#73705F" stroke-width="1.4" fill="none">
    <line x1="500" y1="116" x2="580" y2="180" marker-end="url(#arc)"/>
    <line x1="500" y1="176" x2="580" y2="196" marker-end="url(#arc)"/>
    <line x1="500" y1="236" x2="580" y2="216" marker-end="url(#arc)"/>
    <line x1="500" y1="296" x2="580" y2="232" marker-end="url(#arc)"/>
  </g>

  <!-- decision gate -->
  <rect x="584" y="166" width="190" height="84" rx="8" fill="#1C1B17"/>
  <text x="679" y="190" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#ffffff">DECISION GATE</text>
  <text x="679" y="214" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#4F7A4A" font-weight="bold">ALLOW</text>
  <text x="679" y="232" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#C49A4A" font-weight="bold">REVIEW</text>
  <text x="679" y="250" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#B5462E" font-weight="bold">BLOCK</text>

  <!-- bottom caption -->
  <text x="410" y="362" text-anchor="middle" font-size="14" fill="#1C1B17">Each probe scores the residual stream against one safety direction.</text>
  <text x="410" y="382" text-anchor="middle" font-style="italic" font-size="13" fill="#46443B">The gate combines the scores into a single decision before the response leaves the model.</text>
</svg>
