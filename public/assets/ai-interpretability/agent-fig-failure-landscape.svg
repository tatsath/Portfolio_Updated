<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 452" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="860" height="452" fill="#FBF9F3"/>
  <defs>
    <marker id="fl" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0,0 L10,0 L5,8 Z" fill="#9A6A12"/></marker>
  </defs>

  <text x="430" y="26" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">WHY AGENTS FAIL</text>
  <text x="430" y="44" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic" font-size="11.5" fill="#73705F">the Berkeley study analyzed 1,642 traces across 7 agent frameworks</text>

  <!-- Row 1: System design -->
  <rect x="20" y="58" width="820" height="62" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="20" y="58" width="10" height="62" fill="#3A4A50"/>
  <text x="46" y="82" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17" letter-spacing="0.5">SYSTEM DESIGN ISSUES</text>
  <text x="46" y="104" font-size="13.5" fill="#46443B">disobey task spec &#183; repeat steps &#183; lose context &#183; miss the stop condition</text>
  <text x="824" y="82" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#3A4A50">~44%</text>

  <!-- Row 2: Inter-agent misalignment -->
  <rect x="20" y="128" width="820" height="62" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="20" y="128" width="10" height="62" fill="#9A6A12"/>
  <text x="46" y="152" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17" letter-spacing="0.5">INTER-AGENT MISALIGNMENT</text>
  <text x="46" y="174" font-size="13.5" fill="#46443B">communication breakdown &#183; conflicting objectives &#183; ignored peer input</text>
  <text x="824" y="152" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#9A6A12">~32%</text>

  <!-- Row 3: Task verification -->
  <rect x="20" y="198" width="820" height="62" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="20" y="198" width="10" height="62" fill="#7FA15A"/>
  <text x="46" y="222" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17" letter-spacing="0.5">TASK VERIFICATION FAILURES</text>
  <text x="46" y="244" font-size="13.5" fill="#46443B">missing quality checks &#183; error propagation &#183; premature or no termination</text>
  <text x="824" y="222" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#73705F">the rest</text>

  <!-- Row 4: Tool & security misfires -->
  <rect x="20" y="268" width="820" height="62" rx="6" fill="#ffffff" stroke="#D6CBB1" stroke-width="1.2"/>
  <rect x="20" y="268" width="10" height="62" fill="#B5462E"/>
  <text x="46" y="292" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="bold" fill="#1C1B17" letter-spacing="0.5">TOOL AND SECURITY MISFIRES</text>
  <text x="46" y="314" font-size="13.5" fill="#46443B">wrong or hallucinated tool &#183; malformed params &#183; tool bypass &#183; hijacked call</text>
  <text x="824" y="292" text-anchor="end" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#73705F">cross-cutting</text>

  <!-- funnel arrow -->
  <line x1="430" y1="336" x2="430" y2="360" stroke="#9A6A12" stroke-width="2" marker-end="url(#fl)"/>

  <!-- bottom band: the common thread -->
  <rect x="120" y="370" width="620" height="64" rx="8" fill="#1C1B17"/>
  <text x="430" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Different surface symptoms. One common thread:</text>
  <text x="430" y="418" text-anchor="middle" font-style="italic" font-size="13" fill="#C49A4A">the decision behind each one forms inside the model before it shows in the output.</text>
</svg>
