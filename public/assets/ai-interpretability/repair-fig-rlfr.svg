<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="800" height="340" fill="#FBF9F3"/>
  <defs>
    <marker id="rlfr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/></marker>
    <marker id="rlfru" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A6A12"/></marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">RL WITH INTERPRETABILITY REWARDS (RLFR)</text>

  <!-- Stage 1: Policy -->
  <rect x="36" y="86" width="140" height="64" rx="8" fill="#3A4A50"/>
  <text x="106" y="114" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#ffffff">POLICY</text>
  <text x="106" y="134" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" fill="#ffffff">(the LLM)</text>

  <!-- arrow -->
  <line x1="176" y1="118" x2="208" y2="118" stroke="#73705F" stroke-width="1.6" marker-end="url(#rlfr)"/>

  <!-- Stage 2: Rollout -->
  <rect x="210" y="86" width="160" height="64" rx="8" fill="#F4F0E6" stroke="#D6CBB1" stroke-width="1.3"/>
  <text x="290" y="110" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#1C1B17">ROLLOUT</text>
  <text x="290" y="132" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic" font-size="11.5" fill="#46443B">generated response</text>

  <line x1="370" y1="118" x2="402" y2="118" stroke="#73705F" stroke-width="1.6" marker-end="url(#rlfr)"/>

  <!-- Stage 3: Probe reads internal state -->
  <rect x="404" y="74" width="190" height="88" rx="8" fill="#ffffff" stroke="#4F7A4A" stroke-width="1.6"/>
  <text x="499" y="98" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#4F7A4A">PROBE</text>
  <text x="499" y="118" text-anchor="middle" font-size="12" fill="#46443B">reads the model's</text>
  <text x="499" y="134" text-anchor="middle" font-size="12" fill="#46443B">internal state on this</text>
  <text x="499" y="150" text-anchor="middle" font-size="12" fill="#46443B">rollout</text>

  <line x1="594" y1="118" x2="626" y2="118" stroke="#73705F" stroke-width="1.6" marker-end="url(#rlfr)"/>

  <!-- Stage 4: Reward -->
  <rect x="628" y="86" width="140" height="64" rx="8" fill="#9A6A12"/>
  <text x="698" y="112" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#ffffff">REWARD</text>
  <text x="698" y="134" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic" font-size="11.5" fill="#ffffff">high if good, low if bad</text>

  <!-- feedback loop arrow -->
  <path d="M698 150 C 698 220 400 240 106 220 L 106 152" fill="none" stroke="#9A6A12" stroke-width="2.2" marker-end="url(#rlfru)"/>
  <text x="400" y="248" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11.5" font-weight="bold" fill="#9A6A12">policy update</text>
  <text x="400" y="264" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic" font-size="11" fill="#73705F">train the model toward high-reward rollouts</text>

  <!-- caption -->
  <text x="400" y="306" text-anchor="middle" font-size="14" fill="#1C1B17">The probe is the reward function. A feature or probe direction tells the RL loop</text>
  <text x="400" y="326" text-anchor="middle" font-size="14" fill="#1C1B17">what good and bad look like from the inside, not just at the surface.</text>
</svg>
