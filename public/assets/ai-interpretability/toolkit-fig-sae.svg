<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="680" height="440" fill="#FBF9F3"/>

  <text x="300" y="30" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">SPARSE AUTOENCODER</text>

  <!-- Layer 1 -->
  <rect x="150" y="46" width="92" height="34" rx="5" fill="#dfeaf2" stroke="#9fb3c0" stroke-width="1.2"/>
  <text x="196" y="68" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" fill="#1C1B17">Layer 1</text>

  <!-- residual pipe (two-tone) -->
  <rect x="166" y="80" width="60" height="328" fill="#e6eef4" stroke="#b3c3cd" stroke-width="1.2"/>
  <rect x="167" y="206" width="58" height="201" fill="#9dbdd2"/>
  <g stroke="#86a6bc" stroke-width="1"><line x1="167" y1="236" x2="225" y2="236"/><line x1="167" y1="266" x2="225" y2="266"/><line x1="167" y1="296" x2="225" y2="296"/><line x1="167" y1="326" x2="225" y2="326"/><line x1="167" y1="356" x2="225" y2="356"/><line x1="167" y1="386" x2="225" y2="386"/></g>
  <!-- superposed concept marks -->
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" fill="#3A4A50">
    <text x="176" y="120">+</text><text x="200" y="116">o</text><text x="184" y="140">~</text>
    <text x="205" y="146">-</text><text x="176" y="162">o</text><text x="198" y="168">~</text><text x="186" y="186">^</text>
  </g>
  <text x="196" y="230" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" fill="#1C1B17">Layer 2</text>

  <!-- residual stream label + water into SAE -->
  <text x="300" y="150" text-anchor="middle" font-size="13" fill="#46443B">Residual</text>
  <text x="300" y="167" text-anchor="middle" font-size="13" fill="#46443B">stream</text>
  <path d="M226 178 C 300 178 330 214 432 214" fill="none" stroke="#8fb8d6" stroke-width="16" stroke-linecap="round"/>

  <!-- SAE box with slots -->
  <rect x="432" y="92" width="74" height="250" rx="3" fill="#edf0f2" stroke="#8a96a0" stroke-width="1.3"/>
  <g stroke="#c2ccd2" stroke-width="1"><line x1="438" y1="112" x2="500" y2="112"/><line x1="438" y1="132" x2="500" y2="132"/><line x1="438" y1="152" x2="500" y2="152"/><line x1="438" y1="172" x2="500" y2="172"/><line x1="438" y1="212" x2="500" y2="212"/><line x1="438" y1="232" x2="500" y2="232"/><line x1="438" y1="272" x2="500" y2="272"/><line x1="438" y1="292" x2="500" y2="292"/></g>

  <!-- taps + water + labels -->
  <!-- tap 1 Dog -->
  <rect x="506" y="124" width="20" height="12" rx="2" fill="#9aa6ae"/>
  <circle cx="512" cy="120" r="4" fill="#9aa6ae"/>
  <path d="M526 132 C 546 134 552 142 552 156" fill="none" stroke="#8fb8d6" stroke-width="7" stroke-linecap="round"/>
  <text x="592" y="136" text-anchor="middle" font-size="15" fill="#1C1B17">Dog</text>
  <!-- tap 2 Cat -->
  <rect x="506" y="182" width="20" height="12" rx="2" fill="#9aa6ae"/>
  <circle cx="512" cy="178" r="4" fill="#9aa6ae"/>
  <path d="M526 190 C 546 192 552 200 552 214" fill="none" stroke="#8fb8d6" stroke-width="7" stroke-linecap="round"/>
  <text x="592" y="194" text-anchor="middle" font-size="15" fill="#1C1B17">Cat</text>
  <!-- tap 3 Automobile -->
  <rect x="506" y="244" width="20" height="12" rx="2" fill="#9aa6ae"/>
  <circle cx="512" cy="240" r="4" fill="#9aa6ae"/>
  <path d="M526 252 C 546 254 552 262 552 276" fill="none" stroke="#8fb8d6" stroke-width="7" stroke-linecap="round"/>
  <text x="592" y="256" text-anchor="middle" font-size="15" fill="#1C1B17">Automobile</text>
  <!-- tap 4 Tree -> long stream to Layer 3 -->
  <rect x="506" y="300" width="20" height="12" rx="2" fill="#9aa6ae"/>
  <circle cx="512" cy="296" r="4" fill="#9aa6ae"/>
  <path d="M526 310 C 556 314 566 340 566 372 C 566 388 580 392 596 396" fill="none" stroke="#8fb8d6" stroke-width="8" stroke-linecap="round"/>
  <text x="588" y="350" text-anchor="middle" font-size="15" fill="#1C1B17">Tree</text>

  <!-- Layer 3 -->
  <rect x="560" y="398" width="96" height="32" rx="5" fill="#dfeaf2" stroke="#9fb3c0" stroke-width="1.2"/>
  <text x="608" y="419" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12.5" fill="#1C1B17">Layer 3</text>
</svg>
