<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="720" height="470" fill="#FBF9F3"/>
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a5a4a"/></marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">CIRCUIT TRACING</text>

  <!-- output row -->
  <text x="40" y="62" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#9A6A12">output</text>
  <rect x="40" y="48" width="640" height="40" rx="4" fill="#f3efe6" stroke="#D6CBB1" stroke-width="1.2"/>
  <text x="56" y="73" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" fill="#46443B">Fact: the capital of the state containing Dallas is</text>
  <rect x="600" y="54" width="72" height="28" rx="4" fill="#9A6A12"/>
  <text x="636" y="73" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#ffffff">Austin</text>

  <!-- nodes -->
  <g font-family="Georgia, 'DejaVu Serif', serif">
    <!-- upper: say Austin -->
    <rect x="470" y="150" width="130" height="40" rx="6" fill="#f3efe6" stroke="#a9947f" stroke-width="1.3"/>
    <text x="535" y="175" text-anchor="middle" font-size="14" fill="#1C1B17">say Austin</text>
    <!-- mid: say a capital -->
    <rect x="190" y="246" width="140" height="40" rx="6" fill="#f3efe6" stroke="#a9947f" stroke-width="1.3"/>
    <text x="260" y="271" text-anchor="middle" font-size="14" fill="#1C1B17">say a capital</text>
    <!-- mid: Texas -->
    <rect x="470" y="246" width="130" height="40" rx="6" fill="#f3efe6" stroke="#a9947f" stroke-width="1.3"/>
    <text x="535" y="271" text-anchor="middle" font-size="14" fill="#1C1B17">Texas</text>
    <!-- bottom features -->
    <rect x="120" y="340" width="110" height="38" rx="6" fill="#f3efe6" stroke="#a9947f" stroke-width="1.3"/>
    <text x="175" y="364" text-anchor="middle" font-size="14" fill="#1C1B17">capital</text>
    <rect x="270" y="340" width="110" height="38" rx="6" fill="#f3efe6" stroke="#a9947f" stroke-width="1.3"/>
    <text x="325" y="364" text-anchor="middle" font-size="14" fill="#1C1B17">state</text>
    <rect x="480" y="340" width="110" height="38" rx="6" fill="#f3efe6" stroke="#a9947f" stroke-width="1.3"/>
    <text x="535" y="364" text-anchor="middle" font-size="14" fill="#1C1B17">Dallas</text>
  </g>

  <!-- edges -->
  <g stroke="#7a5a4a" stroke-width="1.6" fill="none">
    <path d="M175 340 C 175 312 230 300 245 288" marker-end="url(#ag)"/>
    <path d="M325 340 C 325 318 290 300 278 288" marker-end="url(#ag)"/>
    <path d="M535 340 L535 288" marker-end="url(#ag)"/>
    <path d="M300 246 C 320 215 470 205 500 192" marker-end="url(#ag)"/>
    <path d="M535 246 L535 192" marker-end="url(#ag)"/>
    <path d="M300 250 C 340 140 560 120 612 84" marker-end="url(#ag)"/>
    <path d="M540 150 C 560 120 600 104 626 84" marker-end="url(#ag)"/>
  </g>

  <!-- input row -->
  <text x="40" y="416" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="10.5" fill="#9A6A12">input</text>
  <rect x="40" y="402" width="640" height="40" rx="4" fill="#f3efe6" stroke="#D6CBB1" stroke-width="1.2"/>
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" fill="#46443B">
    <text x="56" y="427">Fact: the</text>
    <rect x="150" y="409" width="66" height="26" rx="3" fill="#e9e0cb"/><text x="183" y="427" text-anchor="middle" fill="#1C1B17">capital</text>
    <text x="224" y="427">of the</text>
    <rect x="294" y="409" width="54" height="26" rx="3" fill="#e9e0cb"/><text x="321" y="427" text-anchor="middle" fill="#1C1B17">state</text>
    <text x="356" y="427">containing</text>
    <rect x="470" y="409" width="64" height="26" rx="3" fill="#e9e0cb"/><text x="502" y="427" text-anchor="middle" fill="#1C1B17">Dallas</text>
    <text x="542" y="427">is</text>
  </g>
</svg>
