<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Georgia, 'DejaVu Serif', serif">
  <rect x="0" y="0" width="820" height="360" fill="#FBF9F3"/>
  <defs>
    <marker id="h1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#73705F"/></marker>
    <marker id="h1g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4F7A4A"/></marker>
    <marker id="h1r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B5462E"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#9A6A12" letter-spacing="1">READING THE TOOL CALL BEFORE IT FIRES</text>

  <!-- residual stream at tool-selection moment -->
  <rect x="40" y="120" width="150" height="120" rx="6" fill="#e6eef4" stroke="#b3c3cd" stroke-width="1.4"/>
  <text x="115" y="144" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#3A4A50">state at the</text>
  <text x="115" y="160" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="11" fill="#3A4A50">tool-call token</text>
  <g font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="13" fill="#3A4A50">
    <text x="64" y="190">+</text><text x="98" y="186">o</text><text x="132" y="194">~</text><text x="162" y="188">-</text>
    <text x="72" y="216">~</text><text x="112" y="220">^</text><text x="150" y="214">o</text>
  </g>

  <line x1="190" y1="180" x2="232" y2="180" stroke="#73705F" stroke-width="1.6" marker-end="url(#h1)"/>

  <!-- probe -->
  <rect x="234" y="156" width="120" height="48" rx="6" fill="#ffffff" stroke="#9A6A12" stroke-width="1.5"/>
  <text x="294" y="184" text-anchor="middle" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#9A6A12">PROBE</text>

  <!-- two outcomes -->
  <line x1="354" y1="172" x2="430" y2="120" stroke="#4F7A4A" stroke-width="1.6" marker-end="url(#h1g)"/>
  <line x1="354" y1="188" x2="430" y2="250" stroke="#B5462E" stroke-width="1.6" marker-end="url(#h1r)"/>

  <!-- grounded call -->
  <rect x="436" y="92" width="344" height="62" rx="8" fill="#ffffff" stroke="#4F7A4A" stroke-width="1.6"/>
  <text x="456" y="118" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#4F7A4A">GROUNDED CALL</text>
  <text x="456" y="140" font-size="12.5" fill="#46443B">real tool, well-formed parameters, appropriate</text>

  <!-- hallucinated call -->
  <rect x="436" y="220" width="344" height="76" rx="8" fill="#ffffff" stroke="#B5462E" stroke-width="1.6"/>
  <text x="456" y="246" font-family="'Courier New','DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#B5462E">HALLUCINATED CALL</text>
  <text x="456" y="268" font-size="12.5" fill="#46443B">wrong or non-existent tool, malformed params,</text>
  <text x="456" y="286" font-size="12.5" fill="#46443B">or "tool bypass" (simulating instead of invoking)</text>

  <!-- caption -->
  <text x="410" y="334" text-anchor="middle" font-style="italic" font-size="13" fill="#73705F">The internal state separates a grounded call from a hallucinated one, in the same forward pass, before either executes.</text>
</svg>
