<svg viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="aW" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a97a1"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1d2d3a">Where AI belongs in the trading workflow</text>
  <text x="40" y="68" font-size="14" fill="#5a6b78" font-style="italic">The value is where mistakes are reversible. The hype is where they aren't.</text>

  <!-- seven stage boxes -->
  <!-- greens -->
  <g>
    <rect x="40" y="110" width="108" height="70" rx="7" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.6"/>
    <text x="94" y="142" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b4d44">Ideation</text>
    <text x="94" y="162" text-anchor="middle" font-size="10.5" fill="#3f6f66">widen funnel</text>

    <rect x="158" y="110" width="108" height="70" rx="7" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.6"/>
    <text x="212" y="142" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b4d44">Data</text>
    <text x="212" y="162" text-anchor="middle" font-size="10.5" fill="#3f6f66">if source is good</text>

    <rect x="276" y="110" width="108" height="70" rx="7" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.6"/>
    <text x="330" y="142" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b4d44">Research</text>
    <text x="330" y="162" text-anchor="middle" font-size="10.5" fill="#3f6f66">reconcile · read</text>
  </g>
  <!-- ambers -->
  <g>
    <rect x="394" y="110" width="108" height="70" rx="7" fill="#f6edd9" stroke="#c79a3f" stroke-width="1.6"/>
    <text x="448" y="142" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6a1f">Signal</text>
    <text x="448" y="162" text-anchor="middle" font-size="10.5" fill="#8a6a1f">= hypothesis</text>

    <rect x="512" y="110" width="108" height="70" rx="7" fill="#f6edd9" stroke="#c79a3f" stroke-width="1.6"/>
    <text x="566" y="138" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6a1f">Backtest</text>
    <text x="566" y="156" text-anchor="middle" font-size="10.5" fill="#8a6a1f">overfitting</text>
    <text x="566" y="170" text-anchor="middle" font-size="10.5" fill="#8a6a1f">danger zone</text>
  </g>
  <!-- red -->
  <rect x="630" y="110" width="108" height="70" rx="7" fill="#f5e6e3" stroke="#b04a3f" stroke-width="1.8"/>
  <text x="684" y="138" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3328">Execution</text>
  <text x="684" y="156" text-anchor="middle" font-size="10.5" fill="#8a3328">irreversible ·</text>
  <text x="684" y="170" text-anchor="middle" font-size="10.5" fill="#8a3328">regulated</text>
  <!-- green again -->
  <rect x="748" y="110" width="92" height="70" rx="7" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.6"/>
  <text x="794" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4d44">Monitor</text>
  <text x="794" y="156" text-anchor="middle" font-size="10.5" fill="#3f6f66">underrated;</text>
  <text x="794" y="170" text-anchor="middle" font-size="10.5" fill="#3f6f66">strong</text>

  <!-- flow arrows -->
  <g stroke="#8a97a1" stroke-width="1.4">
    <line x1="148" y1="145" x2="156" y2="145" marker-end="url(#aW)"/>
    <line x1="266" y1="145" x2="274" y2="145" marker-end="url(#aW)"/>
    <line x1="384" y1="145" x2="392" y2="145" marker-end="url(#aW)"/>
    <line x1="502" y1="145" x2="510" y2="145" marker-end="url(#aW)"/>
    <line x1="620" y1="145" x2="628" y2="145" marker-end="url(#aW)"/>
    <line x1="738" y1="145" x2="746" y2="145" marker-end="url(#aW)"/>
  </g>

  <!-- legend -->
  <g font-size="12">
    <rect x="40" y="232" width="16" height="16" rx="3" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.4"/>
    <text x="64" y="245" fill="#1b4d44">high value, low risk — mistakes caught by a human before money moves</text>
    <rect x="40" y="258" width="16" height="16" rx="3" fill="#f6edd9" stroke="#c79a3f" stroke-width="1.4"/>
    <text x="64" y="271" fill="#8a6a1f">real value, real overfitting risk — AI makes it faster to fool yourself</text>
    <rect x="40" y="284" width="16" height="16" rx="3" fill="#f5e6e3" stroke="#b04a3f" stroke-width="1.4"/>
    <text x="64" y="297" fill="#8a3328">highest risk — irreversible, real money, heaviest regulatory obligations</text>
  </g>

  <text x="40" y="334" font-size="12.5" fill="#2f4858" font-style="italic">Not an argument against agentic trading — an argument for sequencing it correctly.</text>
</svg>
