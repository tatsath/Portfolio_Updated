<svg viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="aF" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a97a1"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1d2d3a">The document factory pipeline</text>
  <text x="40" y="68" font-size="14" fill="#5a6b78" font-style="italic">Everyone obsesses over the inputs and the output. The middle decides whether you can trust it.</text>

  <!-- INPUTS (end - "attention") -->
  <rect x="40" y="120" width="150" height="120" rx="8" fill="#eef1f3" stroke="#8a97a1" stroke-width="1.6"/>
  <text x="115" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d4d58">INPUTS</text>
  <text x="115" y="172" text-anchor="middle" font-size="11" fill="#5a6b78">filings · PDFs</text>
  <text x="115" y="190" text-anchor="middle" font-size="11" fill="#5a6b78">the web</text>
  <text x="115" y="208" text-anchor="middle" font-size="11" fill="#5a6b78">internal data:</text>
  <text x="115" y="224" text-anchor="middle" font-size="11" fill="#5a6b78">rooms · CRM · archives</text>

  <!-- EXTRACTION (middle - trust) -->
  <rect x="206" y="120" width="132" height="120" rx="8" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="2"/>
  <text x="272" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b4d44">EXTRACTION</text>
  <text x="272" y="180" text-anchor="middle" font-size="11" fill="#2a6b60">parse documents</text>
  <text x="272" y="198" text-anchor="middle" font-size="11" fill="#2a6b60">pull the numbers</text>

  <!-- RETRIEVAL (middle - trust) -->
  <rect x="354" y="120" width="132" height="120" rx="8" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="2"/>
  <text x="420" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b4d44">RETRIEVAL</text>
  <text x="420" y="168" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b4d44">&amp; GROUNDING</text>
  <text x="420" y="196" text-anchor="middle" font-size="11" fill="#2a6b60">find the right</text>
  <text x="420" y="212" text-anchor="middle" font-size="11" fill="#2a6b60">evidence</text>

  <!-- DRAFTING -->
  <rect x="502" y="120" width="132" height="120" rx="8" fill="#eef1f3" stroke="#8a97a1" stroke-width="1.6"/>
  <text x="568" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d4d58">DRAFTING</text>
  <text x="568" y="180" text-anchor="middle" font-size="11" fill="#5a6b78">agentic</text>
  <text x="568" y="198" text-anchor="middle" font-size="11" fill="#5a6b78">assembly</text>

  <!-- VERIFICATION (middle - trust) -->
  <rect x="650" y="120" width="80" height="120" rx="8" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="2"/>
  <text x="690" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4d44">VERIFY</text>
  <text x="690" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4d44">&amp; REVIEW</text>
  <text x="690" y="196" text-anchor="middle" font-size="10.5" fill="#2a6b60">check every</text>
  <text x="690" y="211" text-anchor="middle" font-size="10.5" fill="#2a6b60">number</text>

  <!-- OUTPUT (end - "attention") -->
  <rect x="746" y="120" width="94" height="120" rx="8" fill="#eef1f3" stroke="#8a97a1" stroke-width="1.6"/>
  <text x="793" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d4d58">OUTPUT</text>
  <text x="793" y="176" text-anchor="middle" font-size="10.5" fill="#5a6b78">equity report</text>
  <text x="793" y="192" text-anchor="middle" font-size="10.5" fill="#5a6b78">pitchbook</text>
  <text x="793" y="208" text-anchor="middle" font-size="10.5" fill="#5a6b78">credit memo</text>

  <!-- arrows -->
  <g stroke="#8a97a1" stroke-width="1.4">
    <line x1="190" y1="180" x2="204" y2="180" marker-end="url(#aF)"/>
    <line x1="338" y1="180" x2="352" y2="180" marker-end="url(#aF)"/>
    <line x1="486" y1="180" x2="500" y2="180" marker-end="url(#aF)"/>
    <line x1="634" y1="180" x2="648" y2="180" marker-end="url(#aF)"/>
    <line x1="730" y1="180" x2="744" y2="180" marker-end="url(#aF)"/>
  </g>

  <!-- brackets -->
  <path d="M40,256 v10 h450 v-10" fill="none" stroke="#8a97a1" stroke-width="1.4"/>
  <text x="265" y="284" text-anchor="middle" font-size="12.5" fill="#8a97a1" font-style="italic">where attention &amp; marketing go</text>

  <path d="M206,300 v-10 h280 v10 M650,300 v-10 h80 v10" fill="none" stroke="#2a7d6f" stroke-width="1.6"/>
  <text x="448" y="324" text-anchor="middle" font-size="12.5" fill="#1b4d44" font-style="italic">where trust is won or lost — invisible in a demo, decisive in production</text>
</svg>
