<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a8" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2a7d6f"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1d2d3a">The wrong number vs. the right number</text>
  <text x="40" y="68" font-size="13.5" fill="#5a6b78" font-style="italic">Don't ask what your AI costs. Ask what one approved output costs.</text>

  <!-- divider -->
  <line x1="440" y1="92" x2="440" y2="408" stroke="#dde3e7" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT: what firms measure -->
  <text x="60" y="120" font-size="15" font-weight="bold" fill="#5a6b78">WHAT FIRMS MEASURE</text>
  <rect x="90" y="160" width="260" height="120" rx="8" fill="#eef1f3" stroke="#8a97a1" stroke-width="1.6"/>
  <text x="220" y="200" text-anchor="middle" font-size="20" font-weight="bold" fill="#3d4d58">$X / month</text>
  <text x="220" y="228" text-anchor="middle" font-size="12.5" fill="#5a6b78">seats + tokens</text>
  <text x="220" y="256" text-anchor="middle" font-size="22" fill="#7fa88f">✓</text>
  <text x="220" y="312" text-anchor="middle" font-size="12.5" fill="#8a97a1" font-style="italic">tidy, approved —</text>
  <text x="220" y="330" text-anchor="middle" font-size="12.5" fill="#8a97a1" font-style="italic">and tells you nothing</text>

  <!-- RIGHT: what to measure -->
  <text x="468" y="120" font-size="15" font-weight="bold" fill="#1b4d44">WHAT TO MEASURE</text>
  <text x="468" y="140" font-size="12.5" fill="#2a6b60" font-style="italic">cost per APPROVED output</text>

  <!-- stacked components feeding one box -->
  <g>
    <rect x="468" y="158" width="200" height="20" rx="3" fill="#cfe0dd" stroke="#7fb3a9" stroke-width="1"/>
    <text x="478" y="173" font-size="10.5" fill="#1b4d44">token cost (tiny sliver)</text>

    <rect x="468" y="182" width="240" height="24" rx="3" fill="#d9e6e4" stroke="#7fb3a9" stroke-width="1"/>
    <text x="478" y="199" font-size="11" fill="#1b4d44">+ data prep &amp; integration (amortized)</text>

    <rect x="468" y="210" width="240" height="24" rx="3" fill="#d9e6e4" stroke="#7fb3a9" stroke-width="1"/>
    <text x="478" y="227" font-size="11" fill="#1b4d44">+ workflow &amp; evals</text>

    <rect x="468" y="238" width="240" height="24" rx="3" fill="#d9e6e4" stroke="#7fb3a9" stroke-width="1"/>
    <text x="478" y="255" font-size="11" fill="#1b4d44">+ human review (often the largest)</text>

    <rect x="468" y="266" width="240" height="24" rx="3" fill="#d9e6e4" stroke="#7fb3a9" stroke-width="1"/>
    <text x="478" y="283" font-size="11" fill="#1b4d44">+ compliance &amp; ops overhead</text>
  </g>

  <!-- arrow to result -->
  <line x1="588" y1="296" x2="588" y2="318" stroke="#2a7d6f" stroke-width="1.8" marker-end="url(#a8)"/>
  <rect x="468" y="326" width="340" height="58" rx="8" fill="#2f6f63"/>
  <text x="638" y="350" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">one reviewed memo / compliant letter /</text>
  <text x="638" y="370" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">signed-off credit model</text>

  <text x="40" y="424" font-size="12" fill="#2f4858" font-style="italic">The approved output includes every hidden cost — you can't produce it without them. The token bill is a rounding error.</text>
</svg>
