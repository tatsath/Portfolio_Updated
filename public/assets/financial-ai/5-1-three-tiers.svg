<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1d2d3a">Three tiers, not two</text>
  <text x="40" y="68" font-size="14" fill="#5a6b78" font-style="italic">The fault line isn't agent vs. RAG. It's probabilistic reading vs. deterministic extraction.</text>

  <!-- bracket label: probabilistic reading (covers the two top tiers) -->
  <path d="M58,100 h-0 v176 h0" fill="none"/>
  <rect x="40" y="100" width="14" height="176" fill="#eef1f3" stroke="#8a97a1" stroke-width="1.2"/>
  <text x="47" y="188" font-size="12.5" font-weight="bold" fill="#5a6b78" transform="rotate(-90 47 188)" text-anchor="middle">probabilistic reading</text>

  <!-- Tier 1: Agent -->
  <rect x="70" y="100" width="760" height="76" rx="8" fill="#eef1f3" stroke="#8a97a1" stroke-width="1.6"/>
  <text x="92" y="128" font-size="16" font-weight="bold" fill="#3d4d58">Agent</text>
  <text x="92" y="150" font-size="12.5" fill="#5a6b78">model + tools, reasons &amp; acts in a loop &#8212; open-ended, flexible, multi-step work</text>
  <text x="92" y="168" font-size="12" fill="#9aa5ad" font-style="italic">weakness: slow, costly, hard to audit; fragile on exact numbers</text>

  <!-- Tier 2: RAG, drawn as a thinner substrate band -->
  <rect x="70" y="184" width="760" height="64" rx="8" fill="#e6eaed" stroke="#8a97a1" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="92" y="210" font-size="15" font-weight="bold" fill="#5a6b78">RAG <tspan font-size="12" font-weight="normal" font-style="italic" fill="#9aa5ad">— a retrieval technique, not a peer tier</tspan></text>
  <text x="92" y="230" font-size="12.5" fill="#5a6b78">chunk → embed → retrieve → generate — sits underneath an agent or an extraction pipeline</text>
  <text x="92" y="244" font-size="11.5" fill="#9aa5ad" font-style="italic">improves which page you find — not whether the value is read correctly</text>

  <!-- Tier 3: Deterministic extraction (the accent) -->
  <rect x="70" y="284" width="760" height="92" rx="8" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="2"/>
  <rect x="40" y="284" width="14" height="92" fill="#cfe0dd" stroke="#2a7d6f" stroke-width="1.2"/>
  <text x="47" y="330" font-size="12.5" font-weight="bold" fill="#1b4d44" transform="rotate(-90 47 330)" text-anchor="middle">deterministic</text>
  <text x="92" y="314" font-size="16" font-weight="bold" fill="#1b4d44">Deterministic extraction + validation</text>
  <text x="92" y="336" font-size="12.5" fill="#2a6b60">parse → structured schema → rule checks → cell-level citation + confidence + abstention</text>
  <text x="92" y="356" font-size="12" fill="#2a6b60" font-style="italic">exact, repeatable, audit-grade numbers · needs known fields; ingestion cost upfront</text>

  <text x="70" y="408" font-size="13" fill="#2f4858" font-style="italic">Probabilistic reading is fine for synthesis. Finance numbers need the bottom layer.</text>
</svg>
