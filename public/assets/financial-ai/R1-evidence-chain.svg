<svg viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f4858"/>
    </marker>
    <marker id="arrowReject" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b04a3f"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1d2d3a">The evidence chain</text>
  <text x="40" y="68" font-size="14" fill="#5a6b78" font-style="italic">Every claim is something you can trace, recompute, and sign off on.</text>

  <!-- main chain nodes -->
  <!-- Claim -->
  <rect x="40" y="100" width="160" height="74" rx="8" fill="#eef3f5" stroke="#2f4858" stroke-width="1.5"/>
  <text x="120" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2d3a">Claim</text>
  <text x="120" y="154" text-anchor="middle" font-size="12" fill="#5a6b78">the assertion</text>

  <!-- Source -->
  <rect x="240" y="100" width="160" height="74" rx="8" fill="#eef3f5" stroke="#2f4858" stroke-width="1.5"/>
  <text x="320" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2d3a">Source</text>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="#5a6b78">document · page</text>
  <text x="320" y="164" text-anchor="middle" font-size="12" fill="#5a6b78">cell · footnote</text>

  <!-- Calculation -->
  <rect x="440" y="100" width="160" height="74" rx="8" fill="#eef3f5" stroke="#2f4858" stroke-width="1.5"/>
  <text x="520" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2d3a">Calculation</text>
  <text x="520" y="148" text-anchor="middle" font-size="12" fill="#5a6b78">recompute ·</text>
  <text x="520" y="164" text-anchor="middle" font-size="12" fill="#5a6b78">reconcile</text>

  <!-- Reviewer (accent — the human control point) -->
  <rect x="640" y="100" width="160" height="74" rx="8" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.8"/>
  <text x="720" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b4d44">Reviewer</text>
  <text x="720" y="154" text-anchor="middle" font-size="12" fill="#2a6b60">sign-off</text>

  <!-- arrows forward -->
  <line x1="200" y1="137" x2="234" y2="137" stroke="#2f4858" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="400" y1="137" x2="434" y2="137" stroke="#2f4858" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="600" y1="137" x2="634" y2="137" stroke="#2f4858" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- reject loop: reviewer back to source -->
  <path d="M700,174 C660,228 380,228 322,176" fill="none" stroke="#b04a3f" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowReject)"/>
  <text x="510" y="222" text-anchor="middle" font-size="12" fill="#b04a3f" font-style="italic">rejected / sent back</text>

  <!-- contrast box -->
  <text x="40" y="284" font-size="13" fill="#8a97a1" font-style="italic">What most demos actually show:</text>
  <rect x="40" y="296" width="120" height="44" rx="6" fill="#f1f2f3" stroke="#c3cbd1" stroke-width="1.2"/>
  <text x="100" y="323" text-anchor="middle" font-size="14" fill="#9aa5ad">Question</text>
  <rect x="210" y="296" width="120" height="44" rx="6" fill="#f1f2f3" stroke="#c3cbd1" stroke-width="1.2"/>
  <text x="270" y="323" text-anchor="middle" font-size="14" fill="#9aa5ad">Answer</text>
  <rect x="380" y="296" width="80" height="44" rx="6" fill="#f1f2f3" stroke="#c3cbd1" stroke-width="1.2"/>
  <text x="420" y="325" text-anchor="middle" font-size="20" fill="#9aa5ad">🤞</text>
  <line x1="160" y1="318" x2="204" y2="318" stroke="#c3cbd1" stroke-width="1.6" marker-end="url(#arrowSlate)"/>
  <line x1="330" y1="318" x2="374" y2="318" stroke="#c3cbd1" stroke-width="1.6" marker-end="url(#arrowSlate)"/>
</svg>
