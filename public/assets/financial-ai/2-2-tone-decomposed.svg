<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="aT" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2a7d6f"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1d2d3a">What "tone" actually decomposes into</text>
  <text x="40" y="68" font-size="13.5" fill="#5a6b78" font-style="italic">Generic sentiment misclassifies financial language (Loughran–McDonald, 2011).</text>
  <text x="40" y="86" font-size="13.5" fill="#5a6b78" font-style="italic">The signal is in the texture — and most of it is in the Q&amp;A.</text>

  <!-- central node -->
  <rect x="60" y="190" width="170" height="64" rx="10" fill="#2f4858" />
  <text x="145" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Management</text>
  <text x="145" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">tone</text>

  <!-- greyed naive gauge -->
  <rect x="60" y="300" width="170" height="40" rx="6" fill="#f1f2f3" stroke="#c3cbd1" stroke-width="1.3"/>
  <text x="145" y="318" text-anchor="middle" font-size="11.5" fill="#9aa5ad">positive ◖ negative</text>
  <text x="145" y="333" text-anchor="middle" font-size="10.5" fill="#9aa5ad" font-style="italic">what naive sentiment measures</text>

  <!-- five branches -->
  <g>
    <rect x="360" y="96" width="470" height="42" rx="6" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.5"/>
    <text x="378" y="122" font-size="13.5" fill="#1b4d44"><tspan font-weight="bold">Uncertainty / hedging</tspan> — "should/could" replacing "will"</text>

    <rect x="360" y="148" width="470" height="42" rx="6" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.5"/>
    <text x="378" y="174" font-size="13.5" fill="#1b4d44"><tspan font-weight="bold">Q&amp;A evasion</tspan> — non-answers; which questions were dodged</text>

    <rect x="360" y="200" width="470" height="42" rx="6" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.5"/>
    <text x="378" y="226" font-size="13.5" fill="#1b4d44"><tspan font-weight="bold">Guidance discipline</tspan> — specific vs. vague; did precision shift?</text>

    <rect x="360" y="252" width="470" height="42" rx="6" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.5"/>
    <text x="378" y="278" font-size="13.5" fill="#1b4d44"><tspan font-weight="bold">Language drift</tspan> — "strong" quietly becomes "resilient"</text>

    <rect x="360" y="304" width="470" height="42" rx="6" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.5"/>
    <text x="378" y="330" font-size="13.5" fill="#1b4d44"><tspan font-weight="bold">Tone-vs-numbers gap</tspan> — upbeat delivery, decelerating KPI</text>
  </g>

  <!-- connectors -->
  <g stroke="#2a7d6f" stroke-width="1.6" fill="none">
    <path d="M230,210 C300,150 300,120 354,117" marker-end="url(#aT)"/>
    <path d="M230,216 C300,190 300,172 354,169" marker-end="url(#aT)"/>
    <path d="M230,222 L354,221" marker-end="url(#aT)"/>
    <path d="M230,228 C300,250 300,268 354,273" marker-end="url(#aT)"/>
    <path d="M230,234 C300,300 300,320 354,325" marker-end="url(#aT)"/>
  </g>
</svg>
