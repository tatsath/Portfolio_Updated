<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1d2d3a">The approved-use matrix</text>
  <text x="40" y="68" font-size="13.5" fill="#5a6b78" font-style="italic">Name the approved tools for each tier. "Use AI carefully" is not a policy.</text>

  <!-- GREEN -->
  <rect x="40" y="96" width="800" height="86" rx="8" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.8"/>
  <rect x="40" y="96" width="14" height="86" rx="4" fill="#2a7d6f"/>
  <text x="74" y="124" font-size="16" font-weight="bold" fill="#1b4d44">GENERALLY PERMITTED</text>
  <text x="74" y="144" font-size="12" fill="#2a6b60" font-style="italic">low risk — no client data, nothing client-facing</text>
  <text x="74" y="167" font-size="12.5" fill="#3f6f66">internal memos · summarizing public articles · reformatting internal docs · agenda brainstorming</text>

  <!-- AMBER -->
  <rect x="40" y="194" width="800" height="86" rx="8" fill="#f6edd9" stroke="#c79a3f" stroke-width="1.8"/>
  <rect x="40" y="194" width="14" height="86" rx="4" fill="#c79a3f"/>
  <text x="74" y="222" font-size="16" font-weight="bold" fill="#8a6a1f">PERMITTED — WITH MANDATORY HUMAN REVIEW</text>
  <text x="74" y="242" font-size="12" fill="#8a6a1f" font-style="italic">elevated risk — client-facing or uses client data</text>
  <text x="74" y="265" font-size="12.5" fill="#8a6a1f">client emails · portfolio commentary · meeting notes entering the record · marketing copy</text>

  <!-- RED -->
  <rect x="40" y="292" width="800" height="98" rx="8" fill="#f5e6e3" stroke="#b04a3f" stroke-width="1.8"/>
  <rect x="40" y="292" width="14" height="98" rx="4" fill="#b04a3f"/>
  <text x="74" y="320" font-size="16" font-weight="bold" fill="#8a3328">PROHIBITED</text>
  <text x="74" y="340" font-size="12" fill="#8a3328" font-style="italic">unacceptable risk</text>
  <text x="74" y="363" font-size="12.5" fill="#8a3328">client PII / MNPI in non-approved tools · unreviewed client-facing claims ·</text>
  <text x="74" y="381" font-size="12.5" fill="#8a3328">anything unsubstantiable, or that can't be recorded and reconstructed</text>
</svg>
