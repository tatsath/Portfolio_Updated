<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1d2d3a">Build / Buy / Configure</text>
  <text x="40" y="68" font-size="14" fill="#5a6b78" font-style="italic">Most firms belong in "configure" — not "build from scratch" or "buy and pray."</text>

  <!-- axes -->
  <!-- y axis label -->
  <text x="58" y="300" font-size="13" font-weight="bold" fill="#3d4d58" transform="rotate(-90 58 300)" text-anchor="middle">Proprietary / sensitive data?</text>
  <text x="92" y="120" font-size="11" fill="#8a97a1">confidential</text>
  <text x="92" y="468" font-size="11" fill="#8a97a1">public</text>
  <!-- x axis label -->
  <text x="455" y="520" font-size="13" font-weight="bold" fill="#3d4d58" text-anchor="middle">Source of competitive edge?</text>
  <text x="150" y="500" font-size="11" fill="#8a97a1">table stakes</text>
  <text x="760" y="500" font-size="11" fill="#8a97a1" text-anchor="end">core edge</text>

  <!-- quadrant grid -->
  <line x1="130" y1="100" x2="130" y2="480" stroke="#8a97a1" stroke-width="1.6"/>
  <line x1="130" y1="480" x2="780" y2="480" stroke="#8a97a1" stroke-width="1.6"/>
  <line x1="455" y1="100" x2="455" y2="480" stroke="#dde3e7" stroke-width="1.3"/>
  <line x1="130" y1="290" x2="780" y2="290" stroke="#dde3e7" stroke-width="1.3"/>

  <!-- top-left: confidential + table stakes -> Buy secure / private -->
  <rect x="142" y="112" width="300" height="166" rx="8" fill="#eef1f3" stroke="#8a97a1" stroke-width="1.5"/>
  <text x="292" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#3d4d58">BUY SECURE / PRIVATE</text>
  <text x="292" y="180" text-anchor="middle" font-size="12" fill="#5a6b78">sensitive but not differentiating</text>
  <text x="292" y="206" text-anchor="middle" font-size="12" fill="#5a6b78">→ private deployment, strict</text>
  <text x="292" y="222" text-anchor="middle" font-size="12" fill="#5a6b78">data controls</text>

  <!-- top-right: confidential + core edge -> Build / Own -->
  <rect x="468" y="112" width="300" height="166" rx="8" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="2"/>
  <text x="618" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b4d44">BUILD / OWN</text>
  <text x="618" y="180" text-anchor="middle" font-size="12" fill="#2a6b60">proprietary research archive</text>
  <text x="618" y="200" text-anchor="middle" font-size="12" fill="#2a6b60">house credit / covenant logic</text>
  <text x="618" y="220" text-anchor="middle" font-size="12" fill="#2a6b60">live-deal data · firm models</text>

  <!-- bottom-left: public + table stakes -> Buy -->
  <rect x="142" y="302" width="300" height="166" rx="8" fill="#eef1f3" stroke="#8a97a1" stroke-width="1.5"/>
  <text x="292" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#3d4d58">BUY</text>
  <text x="292" y="370" text-anchor="middle" font-size="12" fill="#5a6b78">commodity research search</text>
  <text x="292" y="390" text-anchor="middle" font-size="12" fill="#5a6b78">market data · filings coverage</text>
  <text x="292" y="410" text-anchor="middle" font-size="12" fill="#5a6b78">standard pitchbook scaffolding</text>

  <!-- bottom-right: public + core edge -> Configure -->
  <rect x="468" y="302" width="300" height="166" rx="8" fill="#cfe0dd" stroke="#2a7d6f" stroke-width="2"/>
  <text x="618" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b4d44">CONFIGURE</text>
  <text x="618" y="366" text-anchor="middle" font-size="12" fill="#1b4d44" font-style="italic">the right default for most firms</text>
  <text x="618" y="392" text-anchor="middle" font-size="12" fill="#2a6b60">license the engine + content,</text>
  <text x="618" y="412" text-anchor="middle" font-size="12" fill="#2a6b60">own the workflow, format,</text>
  <text x="618" y="428" text-anchor="middle" font-size="12" fill="#2a6b60">source rules &amp; evals</text>

  <!-- always-yours overlay banner -->
  <rect x="142" y="500" width="626" height="34" rx="6" fill="#2f4858"/>
  <text x="455" y="522" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Verification + evidence + review layer = always yours, whatever you buy</text>
</svg>
