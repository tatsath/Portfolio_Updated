<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="aSlate" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f4858"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1d2d3a">Usage is not adoption</text>
  <text x="40" y="68" font-size="14" fill="#5a6b78" font-style="italic">Most firms are on the left and believe they are on the right.</text>

  <!-- divider -->
  <line x1="440" y1="92" x2="440" y2="392" stroke="#dde3e7" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT: usage -->
  <text x="60" y="116" font-size="16" font-weight="bold" fill="#8a6a3f">USAGE</text>
  <text x="60" y="136" font-size="12.5" fill="#8a97a1" font-style="italic">scattered, unconnected, unrecorded</text>

  <!-- scattered tool blobs -->
  <g fill="#f3eee6" stroke="#c9a978" stroke-width="1.4">
    <rect x="70" y="160" width="92" height="46" rx="6"/>
    <rect x="225" y="150" width="92" height="46" rx="6"/>
    <rect x="120" y="232" width="92" height="46" rx="6"/>
    <rect x="270" y="240" width="92" height="46" rx="6"/>
    <rect x="80" y="310" width="92" height="46" rx="6"/>
    <rect x="250" y="318" width="92" height="46" rx="6"/>
  </g>
  <g font-size="11.5" fill="#8a6a3f" text-anchor="middle">
    <text x="116" y="188">one analyst</text>
    <text x="271" y="178">one prompt</text>
    <text x="166" y="260">no review</text>
    <text x="316" y="268">no record</text>
    <text x="126" y="338">a summary</text>
    <text x="296" y="346">an email</text>
  </g>

  <!-- RIGHT: adoption pipeline -->
  <text x="470" y="116" font-size="16" font-weight="bold" fill="#1b4d44">ADOPTION</text>
  <text x="470" y="136" font-size="12.5" fill="#3f6f66" font-style="italic">one connected, measurable pipeline</text>

  <g>
    <rect x="470" y="158" width="360" height="34" rx="6" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.5"/>
    <text x="650" y="180" text-anchor="middle" font-size="13" fill="#1b4d44">input rules &amp; approved data sources</text>

    <rect x="470" y="200" width="360" height="34" rx="6" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.5"/>
    <text x="650" y="222" text-anchor="middle" font-size="13" fill="#1b4d44">defined workflow</text>

    <rect x="470" y="242" width="360" height="34" rx="6" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.5"/>
    <text x="650" y="264" text-anchor="middle" font-size="13" fill="#1b4d44">human review</text>

    <rect x="470" y="284" width="360" height="34" rx="6" fill="#d9e6e4" stroke="#2a7d6f" stroke-width="1.5"/>
    <text x="650" y="306" text-anchor="middle" font-size="13" fill="#1b4d44">evidence &amp; storage</text>

    <rect x="470" y="326" width="360" height="34" rx="6" fill="#cfe0dd" stroke="#2a7d6f" stroke-width="1.8"/>
    <text x="650" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4d44">success metric</text>
  </g>
  <!-- connecting arrows -->
  <line x1="650" y1="192" x2="650" y2="199" stroke="#2a7d6f" stroke-width="1.8" marker-end="url(#aSlate)"/>
  <line x1="650" y1="234" x2="650" y2="241" stroke="#2a7d6f" stroke-width="1.8" marker-end="url(#aSlate)"/>
  <line x1="650" y1="276" x2="650" y2="283" stroke="#2a7d6f" stroke-width="1.8" marker-end="url(#aSlate)"/>
  <line x1="650" y1="318" x2="650" y2="325" stroke="#2a7d6f" stroke-width="1.8" marker-end="url(#aSlate)"/>
</svg>
